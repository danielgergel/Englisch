":"There's another flight tonight at 9:40, but it's almost full.","de":"Es gibt heute Abend noch einen Flug um 21:40 Uhr, aber er ist fast voll."},{"who":"B","en":"I'll take it, if you can still get me a seat.","de":"Den nehme ich, wenn Sie mir noch einen Platz besorgen können."},{"who":"A","en":"You're in luck, I have one left. It's a middle seat, though.","de":"Sie haben Glück, ich habe noch einen. Allerdings ist es ein Mittelplatz."},{"who":"B","en":"That's fine. Thank you so much for your help.","de":"Das ist in Ordnung. Vielen Dank für Ihre Hilfe."}],"quiz":[{"q":"Why did he miss his flight?","opts":["He overslept","His first flight was late","He lost his passport","He went to the wrong gate"],"a":1},{"q":"What kind of seat does he get?","opts":["Window","Aisle","Middle","First class"],"a":2}],"phrases":[{"en":"I missed my connection.","de":"Ich habe meinen Anschluss verpasst.","note":"'connecting flight' = Anschlussflug."},{"en":"What are my options?","de":"Welche Möglichkeiten habe ich?","note":"Super Frage in Problemsituationen."},{"en":"You're in luck.","de":"Da haben Sie Glück.","note":"Wortwörtlich: 'Sie sind im Glück'."}]},{"id":"d26","lvl":3,"title":"Wohnungsbesichtigung","title_en":"Viewing an apartment","scene":"Du besichtigst eine Wohnung, die du mieten möchtest.","lines":[{"who":"A","en":"Come on in. This is the living room. As you can see, it gets a lot of light.","de":"Kommen Sie rein. Das ist das Wohnzimmer. Wie Sie sehen, bekommt es viel Licht."},{"who":"B","en":"It's really nice. Is the kitchen separate?","de":"Das ist wirklich schön. Ist die Küche separat?"},{"who":"A","en":"Yes, it's right through here. It was renovated last year.","de":"Ja, hier durch. Sie wurde letztes Jahr renoviert."},{"who":"B","en":"How much is the rent, and are utilities included?","de":"Wie hoch ist die Miete, und sind die Nebenkosten enthalten?"},{"who":"A","en":"It's 1,200 a month, and water and heating are included. Electricity isn't.","de":"Es sind 1.200 im Monat, Wasser und Heizung sind inbegriffen. Strom nicht."},{"who":"B","en":"Okay. Are pets allowed? I have a small cat.","de":"Okay. Sind Haustiere erlaubt? Ich habe eine kleine Katze."},{"who":"A","en":"Yes, cats are fine, but you'd have to pay a small deposit.","de":"Ja, Katzen sind kein Problem, aber Sie müssten eine kleine Kaution zahlen."},{"who":"B","en":"That works for me. When could I move in?","de":"Das passt für mich. Wann könnte ich einziehen?"}],"quiz":[{"q":"What is NOT included in the rent?","opts":["Water","Heating","Electricity","Internet"],"a":2},{"q":"What pet does the tenant have?","opts":["A dog","A cat","A bird","None"],"a":1}],"phrases":[{"en":"Are utilities included?","de":"Sind die Nebenkosten enthalten?","note":"'utilities' = Strom, Wasser, Gas usw."},{"en":"That works for me.","de":"Das passt für mich.","note":"Zustimmung bei Terminen/Bedingungen."},{"en":"When could I move in?","de":"Wann könnte ich einziehen?","note":"'move in' / 'move out'."}]},{"id":"d27","lvl":3,"title":"Freunde reden über den Urlaub","title_en":"Friends talking about vacation","scene":"Zwei Freunde plaudern beim Abendessen über ihren letzten Urlaub.","lines":[{"who":"A","en":"So, how was Portugal? I've been dying to hear about it.","de":"Und, wie war Portugal? Ich will unbedingt alles hören."},{"who":"B","en":"Honestly, amazing. The food was incredible and everyone was so friendly.","de":"Ehrlich, fantastisch. Das Essen war unglaublich und alle waren so freundlich."},{"who":"A","en":"Did you get any sun? It's been so grey here.","de":"Hattest du Sonne? Hier war es so grau."},{"who":"B","en":"Every single day. I even got a bit of a sunburn on the first day.","de":"Jeden einzelnen Tag. Ich habe am ersten Tag sogar einen kleinen Sonnenbrand bekommen."},{"who":"A","en":"Ouch! Did you rent a car or just stay in Lisbon?","de":"Autsch! Hast du ein Auto gemietet oder bist du nur in Lissabon geblieben?"},{"who":"B","en":"We rented a car for three days and drove along the coast. It was gorgeous.","de":"Wir haben für drei Tage ein Auto gemietet und sind die Küste entlanggefahren. Es war traumhaft."},{"who":"A","en":"Now I'm jealous. I need a vacation soon.","de":"Jetzt bin ich neidisch. Ich brauche bald Urlaub."},{"who":"B","en":"You should go! I'll send you my list of favorite places.","de":"Du solltest fahren! Ich schicke dir meine Liste mit Lieblingsorten."}],"quiz":[{"q":"What happened on the first day?","opts":["He lost his bag","He got sunburned","He got sick","It rained"],"a":1},{"q":"How long did they rent the car?","opts":["One day","Three days","A week","The whole trip"],"a":1}],"phrases":[{"en":"I've been dying to hear about it.","de":"Ich will unbedingt davon hören.","note":"'dying to' = brennend darauf, etwas zu tun."},{"en":"Every single day.","de":"Jeden einzelnen Tag.","note":"'single' betont."},{"en":"It was gorgeous.","de":"Es war traumhaft.","note":"Stärker als 'beautiful'."}]},{"id":"d28","lvl":4,"title":"Gehaltsverhandlung","title_en":"Negotiating a salary","scene":"Du verhandelst nach einem Jobangebot mit deiner zukünftigen Chefin über das Gehalt.","lines":[{"who":"A","en":"We'd like to offer you the position at 58,000 a year, plus the standard benefits.","de":"Wir möchten Ihnen die Stelle mit 58.000 im Jahr plus den üblichen Zusatzleistungen anbieten."},{"who":"B","en":"Thank you, I'm really excited about the offer. I was hoping for something closer to 65,000, though.","de":"Danke, ich freue mich sehr über das Angebot. Ich hatte aber auf etwas näher an 65.000 gehofft."},{"who":"A","en":"That's a bit above our range. What are you basing that figure on?","de":"Das liegt etwas über unserem Rahmen. Worauf stützen Sie diese Zahl?"},{"who":"B","en":"My experience with similar systems, and the fact that I'd be taking on team-lead responsibilities from day one.","de":"Auf meine Erfahrung mit ähnlichen Systemen und darauf, dass ich von Anfang an Teamleitungsaufgaben übernehmen würde."},{"who":"A","en":"That's fair. I could go up to 62,000, but I can't go beyond that.","de":"Das ist berechtigt. Ich könnte bis 62.000 gehen, aber nicht darüber hinaus."},{"who":"B","en":"Would you consider adding an extra week of vacation to meet me halfway?","de":"Würden Sie in Betracht ziehen, eine zusätzliche Urlaubswoche dazuzugeben, um mir entgegenzukommen?"},{"who":"A","en":"I think we can make that work. Let me run it by HR and get back to you tomorrow.","de":"Ich denke, das lässt sich machen. Ich spreche mit der Personalabteilung und melde mich morgen."},{"who":"B","en":"That sounds fair. I appreciate you being flexible.","de":"Das klingt fair. Ich schätze Ihre Flexibilität."}],"quiz":[{"q":"What is the maximum salary the employer will offer?","opts":["58,000","60,000","62,000","65,000"],"a":2},{"q":"What extra thing does the candidate ask for?","opts":["A company car","An extra week of vacation","Working from home","A bonus"],"a":1}],"phrases":[{"en":"I was hoping for something closer to 65,000.","de":"Ich hatte auf etwas näher an 65.000 gehofft.","note":"Höfliche Art, mehr zu verlangen."},{"en":"Would you consider...?","de":"Würden Sie in Betracht ziehen...?","note":"Starker Einstieg bei Verhandlungen."},{"en":"Let me run it by HR.","de":"Ich kläre das mit der Personalabteilung.","note":"'run it by' = vorlegen, abklären."}]},{"id":"d29","lvl":4,"title":"Defekten Laptop zurückgeben","title_en":"Returning a faulty laptop","scene":"Du bringst einen Laptop zurück, der nach einer Woche Probleme macht.","lines":[{"who":"A","en":"Hi there, what can I do for you today?","de":"Hallo, was kann ich heute für Sie tun?"},{"who":"B","en":"I bought this laptop here last week and the screen keeps flickering. I'd like a refund, please.","de":"Ich habe diesen Laptop letzte Woche hier gekauft und der Bildschirm flackert ständig. Ich hätte gern mein Geld zurück."},{"who":"A","en":"I'm sorry to hear that. Do you have the receipt with you?","de":"Das tut mir leid. Haben Sie den Kassenbon dabei?"},{"who":"B","en":"Yes, here it is. It's still within the 14-day return window.","de":"Ja, hier. Es ist noch innerhalb der 14-tägigen Rückgabefrist."},{"who":"A","en":"You're right. We usually offer an exchange for defective items rather than a refund, though.","de":"Sie haben recht. Bei defekten Artikeln bieten wir normalerweise aber einen Umtausch statt einer Erstattung an."},{"who":"B","en":"I'd rather not have the same model again. Is there any chance of getting my money back?","de":"Ich möchte lieber nicht dasselbe Modell nochmal. Gibt es eine Möglichkeit, mein Geld zurückzubekommen?"},{"who":"A","en":"Let me check with my manager. Given the circumstances, I think she'll agree.","de":"Ich frage meine Chefin. Unter den Umständen wird sie wohl zustimmen."},{"who":"B","en":"I'd appreciate that. I really need this resolved today.","de":"Das wäre mir recht. Ich muss das wirklich heute klären."}],"quiz":[{"q":"What is wrong with the laptop?","opts":["It won't turn on","The screen flickers","The battery dies fast","The keyboard is missing keys"],"a":1},{"q":"What does the customer prefer?","opts":["An exchange","A refund","A repair","A store credit"],"a":1}],"phrases":[{"en":"I'd like a refund, please.","de":"Ich hätte gern eine Erstattung.","note":"'refund' = Geld zurück."},{"en":"It's still within the return window.","de":"Es ist noch innerhalb der Rückgabefrist.","note":"Starkes Argument im Laden."},{"en":"I'd rather not have the same model.","de":"Ich möchte lieber nicht dasselbe Modell.","note":"'I'd rather' + Infinitiv ohne to."}]},{"id":"d30","lvl":4,"title":"Streit unter Freunden","title_en":"Clearing the air with a friend","scene":"Zwei Freunde klären einen Streit, weil einer seit Wochen nicht mehr zurückgeschrieben hat.","lines":[{"who":"A","en":"Hey, thanks for meeting me. I feel like things have been weird between us lately.","de":"Hey, danke, dass du dich mit mir triffst. Ich habe das Gefühl, zwischen uns ist es in letzter Zeit komisch."},{"who":"B","en":"Yeah, I've noticed it too. To be honest, I was a bit hurt that you didn't come to my birthday.","de":"Ja, das ist mir auch aufgefallen. Ehrlich gesagt war ich etwas verletzt, dass du nicht zu meinem Geburtstag gekommen bist."},{"who":"A","en":"I know, and I'm sorry. I was going through a rough patch at work and I didn't want to bring everyone down.","de":"Ich weiß, und es tut mir leid. Ich hatte eine schwierige Phase im Job und wollte niemanden runterziehen."},{"who":"B","en":"You could've just told me. That's what friends are for.","de":"Du hättest es mir einfach sagen können. Dafür sind Freunde da."},{"who":"A","en":"You're right. I shouldn't have just disappeared on you.","de":"Du hast recht. Ich hätte nicht einfach abtauchen sollen."},{"who":"B","en":"Thanks for saying that. I'm not mad anymore, I just wanted to understand.","de":"Danke, dass du das sagst. Ich bin nicht mehr sauer, ich wollte es nur verstehen."},{"who":"A","en":"Let me make it up to you. Dinner is on me this weekend.","de":"Lass es mich wiedergutmachen. Das Essen am Wochenende geht auf mich."},{"who":"B","en":"Deal. And next time, just call me.","de":"Abgemacht. Und ruf mich nächstes Mal einfach an."}],"quiz":[{"q":"Why was B hurt?","opts":["A forgot to call","A didn't come to B's birthday","A borrowed money","A lied"],"a":1},{"q":"Why did A disappear?","opts":["A was on vacation","A had problems at work","A was angry","A moved away"],"a":1}],"phrases":[{"en":"I shouldn't have disappeared on you.","de":"Ich hätte nicht einfach abtauchen sollen.","note":"'shouldn't have' + Partizip: Kritik an der Vergangenheit."},{"en":"That's what friends are for.","de":"Dafür sind Freunde da.","note":"Feste Redewendung."},{"en":"Let me make it up to you.","de":"Lass es mich wiedergutmachen.","note":"'make up for' / 'make it up to'."}]},{"id":"d31","lvl":4,"title":"Projektverzögerung","title_en":"A project delay","scene":"Der Projektleiter informiert den Kunden darüber, dass die Lieferung später kommt.","lines":[{"who":"A","en":"Thanks for joining the call. I'm afraid I have to share some less-than-ideal news.","de":"Danke, dass Sie dabei sind. Leider muss ich Ihnen nicht ganz so gute Nachrichten mitteilen."},{"who":"B","en":"That doesn't sound good. What's going on?","de":"Das klingt nicht gut. Was ist los?"},{"who":"A","en":"One of our suppliers had a production issue, so we won't be able to deliver by the 15th.","de":"Einer unserer Lieferanten hatte ein Produktionsproblem, deshalb können wir nicht bis zum 15. liefern."},{"who":"B","en":"That's a real problem. We've already scheduled our launch around that date.","de":"Das ist ein echtes Problem. Wir haben unseren Start bereits auf dieses Datum gelegt."},{"who":"A","en":"I completely understand. We're looking at the 22nd as a realistic new date.","de":"Das verstehe ich vollkommen. Wir sehen den 22. als realistischen neuen Termin."},{"who":"B","en":"A week's delay is hard to absorb. Is there any way to speed things up?","de":"Eine Woche Verzögerung ist schwer aufzufangen. Gibt es eine Möglichkeit, es zu beschleunigen?"},{"who":"A","en":"We could ship the first batch by air, at our expense, to partially close the gap.","de":"Wir könnten die erste Charge auf unsere Kosten per Luftfracht verschicken, um die Lücke teilweise zu schließen."},{"who":"B","en":"That would help. Please send me the updated timeline in writing today.","de":"Das würde helfen. Bitte schicken Sie mir den aktualisierten Zeitplan heute schriftlich."}],"quiz":[{"q":"Why is the delivery late?","opts":["A supplier had a problem","The customer changed the order","A truck broke down","A strike"],"a":0},{"q":"What does the company offer?","opts":["A refund","Air shipping of the first batch","A discount on the next order","Nothing"],"a":1}],"phrases":[{"en":"I'm afraid I have some bad news.","de":"Leider habe ich schlechte Nachrichten.","note":"'I'm afraid' macht die Nachricht höflicher."},{"en":"Is there any way to speed things up?","de":"Gibt es eine Möglichkeit, es zu beschleunigen?","note":"'speed up' = beschleunigen."},{"en":"at our expense","de":"auf unsere Kosten","note":"Wer zahlt: 'at X's expense'."}]},{"id":"d32","lvl":4,"title":"Schaden am Mietwagen","title_en":"Damage on a rental car","scene":"Bei der Rückgabe des Mietwagens entdeckt der Mitarbeiter einen Kratzer.","lines":[{"who":"A","en":"Welcome back. Let me just do a quick inspection of the vehicle.","de":"Willkommen zurück. Ich mache kurz die Fahrzeugkontrolle."},{"who":"A","en":"Hmm, there's a scratch on the rear bumper. It wasn't on the report when you picked it up.","de":"Hmm, am hinteren Stoßfänger ist ein Kratzer. Der stand bei der Abholung nicht im Bericht."},{"who":"B","en":"That scratch was already there. I took photos when I picked up the car.","de":"Der Kratzer war schon da. Ich habe bei der Abholung Fotos gemacht."},{"who":"A","en":"Do you mind showing them to me?","de":"Können Sie sie mir zeigen?"},{"who":"B","en":"Sure. Here, you can see it clearly, and the timestamp is from Monday morning.","de":"Klar. Hier, man sieht es deutlich, und der Zeitstempel ist von Montagmorgen."},{"who":"A","en":"You're right, it's the same scratch. I apologize for the confusion.","de":"Sie haben recht, es ist derselbe Kratzer. Entschuldigen Sie die Verwirrung."},{"who":"B","en":"No problem, but I'd like it noted on my contract so I'm not charged later.","de":"Kein Problem, aber ich möchte, dass es in meinem Vertrag vermerkt wird, damit mir später nichts berechnet wird."},{"who":"A","en":"Absolutely. I'll add a note and email you a confirmation.","de":"Selbstverständlich. Ich füge eine Notiz hinzu und schicke Ihnen eine Bestätigung per E-Mail."}],"quiz":[{"q":"What proves the scratch was already there?","opts":["A police report","Photos from pickup","A witness","The contract"],"a":1},{"q":"What does the customer want at the end?","opts":["A discount","A note in the contract","A new car","An apology letter"],"a":1}],"phrases":[{"en":"It was already there.","de":"Das war schon da.","note":"Wichtig, um sich gegen Vorwürfe zu wehren."},{"en":"I'd like it noted on my contract.","de":"Ich möchte, dass es im Vertrag vermerkt wird.","note":"Passiv mit 'like + Partizip'."},{"en":"I apologize for the confusion.","de":"Ich entschuldige mich für die Verwirrung.","note":"Formell, im Service üblich."}]},{"id":"d33","lvl":5,"title":"Hitzige Debatte über Homeoffice","title_en":"A debate about remote work","scene":"Zwei Kollegen diskutieren in der Kaffeepause, ob Homeoffice langfristig sinnvoll ist.","lines":[{"who":"A","en":"I get the appeal of working from home, but I honestly think it's eroding company culture.","de":"Ich verstehe den Reiz von Homeoffice, aber ehrlich gesagt untergräbt es meiner Meinung nach die Unternehmenskultur."},{"who":"B","en":"I'd push back on that. People are more productive when they're not stuck in a commute for two hours a day.","de":"Da würde ich widersprechen. Menschen sind produktiver, wenn sie nicht jeden Tag zwei Stunden im Pendelverkehr festhängen."},{"who":"A","en":"Productivity isn't the whole story, though. Spontaneous conversations at the coffee machine spark ideas you'd never get on a video call.","de":"Produktivität ist aber nicht alles. Spontane Gespräche an der Kaffeemaschine bringen Ideen hervor, die man in einem Videocall nie hätte."},{"who":"B","en":"Fair point, but that's a trade-off I'd happily make for flexibility. Besides, juniors can still be mentored remotely if managers put in the effort.","de":"Guter Punkt, aber diesen Kompromiss gehe ich für Flexibilität gern ein. Außerdem können Berufseinsteiger auch remote betreut werden, wenn Vorgesetzte sich Mühe geben."},{"who":"A","en":"That's the problem, though. It takes far more deliberate effort, and most managers simply don't do it.","de":"Das ist ja das Problem. Es erfordert deutlich mehr bewusste Anstrengung, und die meisten Vorgesetzten tun das einfach nicht."},{"who":"B","en":"So the solution is better management, not mandatory office days.","de":"Die Lösung ist also besseres Management, nicht verpflichtende Bürotage."},{"who":"A","en":"Maybe a hybrid model is the sweet spot, then. Three days in, two days out.","de":"Dann ist vielleicht ein Hybridmodell der Idealfall. Drei Tage im Büro, zwei außerhalb."},{"who":"B","en":"I could live with that. We'd probably have to agree to disagree on the exact split.","de":"Damit könnte ich leben. Über die genaue Aufteilung müssten wir uns wohl einfach nicht einig sein."}],"quiz":[{"q":"What does A worry about most?","opts":["Salaries","Company culture","Commute times","Office costs"],"a":1},{"q":"What compromise do they discuss?","opts":["Fully remote","Fully in the office","A hybrid model","Four-day weeks"],"a":2}],"phrases":[{"en":"I'd push back on that.","de":"Da würde ich widersprechen.","note":"Höflicher Widerspruch im Business."},{"en":"It's a trade-off.","de":"Das ist ein Kompromiss / Abwägung.","note":"Vorteile gegen Nachteile."},{"en":"We'll have to agree to disagree.","de":"Wir sind wohl unterschiedlicher Meinung.","note":"Beendet eine Diskussion freundlich."}]},{"id":"d34","lvl":5,"title":"Mitarbeitergespräch","title_en":"A performance review","scene":"Deine Vorgesetzte gibt dir im Jahresgespräch Feedback zu deiner Arbeit.","lines":[{"who":"A","en":"Let's start with the positives. Your handling of the Henderson account was outstanding. Clients keep mentioning it.","de":"Fangen wir mit dem Positiven an. Ihr Umgang mit dem Henderson-Konto war hervorragend. Kunden erwähnen es immer wieder."},{"who":"B","en":"Thank you, that means a lot. It was a steep learning curve, but I'm glad it paid off.","de":"Danke, das bedeutet mir viel. Es war eine steile Lernkurve, aber ich bin froh, dass es sich ausgezahlt hat."},{"who":"A","en":"That said, there's one area I'd like to see you improve: delegating. You tend to take too much on yourself.","de":"Allerdings gibt es einen Bereich, in dem ich Verbesserung sehen möchte: Delegieren. Sie neigen dazu, zu viel selbst zu übernehmen."},{"who":"B","en":"That's a fair criticism. I think I've been reluctant to hand over tasks because I'm afraid they won't be done to my standards.","de":"Das ist eine berechtigte Kritik. Ich war wohl zögerlich beim Abgeben von Aufgaben, weil ich fürchte, sie werden nicht nach meinen Maßstäben erledigt."},{"who":"A","en":"I understand, but if you want to move into a leadership role, learning to trust your team is essential.","de":"Das verstehe ich, aber wenn Sie in eine Führungsrolle wechseln wollen, ist es entscheidend, dem Team zu vertrauen."},{"who":"B","en":"Absolutely. Would it help if I started by mentoring one of the new hires?","de":"Absolut. Würde es helfen, wenn ich damit anfange, einen der Neuen zu betreuen?"},{"who":"A","en":"That's a great idea. Let's set a few concrete goals for the next quarter.","de":"Das ist eine tolle Idee. Setzen wir uns für das nächste Quartal ein paar konkrete Ziele."},{"who":"B","en":"Sounds good. I'd like to have measurable targets so we can track my progress.","de":"Klingt gut. Ich hätte gern messbare Ziele, damit wir meinen Fortschritt verfolgen können."}],"quiz":[{"q":"What does the manager want B to improve?","opts":["Punctuality","Delegating tasks","Writing emails","Speaking to clients"],"a":1},{"q":"What does B suggest as a first step?","opts":["Taking a course","Mentoring a new hire","Changing teams","Working less"],"a":1}],"phrases":[{"en":"That said, there's one area to improve.","de":"Allerdings gibt es einen Bereich zur Verbesserung.","note":"'That said' leitet Kritik nach Lob ein."},{"en":"It was a steep learning curve.","de":"Es war eine steile Lernkurve.","note":"Viel in kurzer Zeit gelernt."},{"en":"That's a fair criticism.","de":"Das ist eine berechtigte Kritik.","note":"Zeigt Souveränität."}]},{"id":"d35","lvl":5,"title":"Networking-Event","title_en":"A networking event","scene":"Auf einer Branchenveranstaltung sprichst du eine fremde Person an und knüpfst Kontakt.","lines":[{"who":"A","en":"Hi, I don't think we've met. I'm Maya, I run a small software consultancy.","de":"Hi, ich glaube, wir kennen uns noch nicht. Ich bin Maya, ich leite eine kleine Softwareberatung."},{"who":"B","en":"Pleasure to meet you, Maya. I'm Daniel, I work in industrial automation. What brings you to this event?","de":"Freut mich, Maya. Ich bin Daniel, ich arbeite in der Industrieautomatisierung. Was führt dich hierher?"},{"who":"A","en":"I'm hoping to find some manufacturing clients. Honestly, it's a new market for us.","de":"Ich hoffe, ein paar Kunden aus der Fertigung zu finden. Ehrlich gesagt ist das für uns ein neuer Markt."},{"who":"B","en":"Interesting! That's actually where we're struggling. Our software is quite outdated, and we've been looking for a partner to modernize it.","de":"Interessant! Genau da haben wir Probleme. Unsere Software ist ziemlich veraltet und wir suchen einen Partner, um sie zu modernisieren."},{"who":"A","en":"That could be a great fit. Do you mind if I ask what systems you're currently running?","de":"Das könnte gut passen. Darf ich fragen, welche Systeme ihr aktuell einsetzt?"},{"who":"B","en":"Mostly legacy tools from the early 2000s. Integration is a nightmare.","de":"Hauptsächlich Altsysteme aus den frühen 2000ern. Die Integration ist ein Albtraum."},{"who":"A","en":"I hear that a lot. Why don't we exchange cards and set up a call next week?","de":"Das höre ich oft. Wie wäre es, wenn wir Karten tauschen und nächste Woche telefonieren?"},{"who":"B","en":"Absolutely. I'll connect with you on LinkedIn too, so we stay in touch.","de":"Sehr gern. Ich vernetze mich auch auf LinkedIn mit dir, damit wir in Kontakt bleiben."}],"quiz":[{"q":"What is Maya looking for at the event?","opts":["A new job","Manufacturing clients","A new apartment","Investors"],"a":1},{"q":"What problem does Daniel's company have?","opts":["Too many clients","Outdated software","No money","Bad managers"],"a":1}],"phrases":[{"en":"What brings you to this event?","de":"Was führt dich hierher?","note":"Perfekt für den Einstieg bei Events."},{"en":"That could be a great fit.","de":"Das könnte gut passen.","note":"Im Business für Kooperation."},{"en":"Let's stay in touch.","de":"Lass uns in Kontakt bleiben.","note":"Standardabschluss."}]},{"id":"d36","lvl":5,"title":"Filmdiskussion","title_en":"Discussing a movie","scene":"Zwei Freunde diskutieren nach dem Kino darüber, wie ihnen ein Thriller gefallen hat.","lines":[{"who":"A","en":"So, what did you make of the ending? I'm still trying to wrap my head around it.","de":"Und, was hältst du vom Ende? Ich versuche immer noch, es zu verstehen."},{"who":"B","en":"Honestly, I found it a bit contrived. The twist came out of nowhere, and it undermined everything that came before.","de":"Ehrlich gesagt fand ich es etwas konstruiert. Die Wendung kam aus dem Nichts und hat alles davor untergraben."},{"who":"A","en":"I couldn't disagree more. If you pay attention, the clues are there from the very first scene.","de":"Da muss ich komplett widersprechen. Wenn man aufpasst, sind die Hinweise schon in der allerersten Szene."},{"who":"B","en":"Maybe, but subtlety isn't the same as plausibility. A man like that wouldn't have behaved that way.","de":"Vielleicht, aber Subtilität ist nicht dasselbe wie Plausibilität. Ein Mann wie er hätte sich nicht so verhalten."},{"who":"A","en":"People are unpredictable under pressure, that's kind of the point of the film.","de":"Menschen sind unter Druck unberechenbar, das ist doch gerade der Punkt des Films."},{"who":"B","en":"Fair enough. I will say the cinematography was stunning, and the lead actor carried the whole thing.","de":"Okay, da ist was dran. Ich muss sagen, die Kameraarbeit war atemberaubend, und der Hauptdarsteller hat den ganzen Film getragen."},{"who":"A","en":"Right? He elevated an average script into something memorable.","de":"Oder? Er hat ein durchschnittliches Drehbuch zu etwas Unvergesslichem gemacht."},{"who":"B","en":"On that we agree. I'd happily watch it again just for his performance.","de":"Dem stimme ich zu. Ich würde ihn mir allein wegen seiner Leistung nochmal ansehen."}],"quiz":[{"q":"What does B think about the ending?","opts":["It was perfect","It was contrived","It was boring","It was too short"],"a":1},{"q":"What do both agree on?","opts":["The script was great","The ending was clear","The lead actor was excellent","The movie was too long"],"a":2}],"phrases":[{"en":"What did you make of the ending?","de":"Was hältst du vom Ende?","note":"'make of' = deuten/bewerten."},{"en":"I couldn't disagree more.","de":"Da muss ich ganz entschieden widersprechen.","note":"Stark, aber freundlich unter Freunden."},{"en":"Fair enough.","de":"Okay, da ist was dran.","note":"Gibt dem Gegenüber recht."}]}],"grammar":[{"id":"g_to_be","lvl":1,"title":"To be (sein)","tip":"'to be' heißt sein: I am, you are, he/she/it is, we/you/they are.\nDeutsche Falle: Das Alter wird mit 'sein' gesagt, nicht mit 'haben': 'Ich habe 30 Jahre' -> I am 30.\nAuch bei Gefühlen: 'Mir ist kalt' -> I am cold. Verneinung: I am not, he is not (isn't).\nBeispiele: I'm from Germany. (Ich komme aus Deutschland.)\nShe isn't at home. (Sie ist nicht zu Hause.)\nAre you tired? (Bist du müde?)","items":[{"q":"I ___ 30 years old.","opts":["have","am","are","is"],"a":1,"why":"Alter mit 'to be': I am 30, nicht 'have'."},{"q":"She ___ a teacher.","opts":["am","are","is","be"],"a":2,"why":"Zu he/she/it gehört 'is'."},{"q":"We ___ friends.","opts":["is","am","are","be"],"a":2,"why":"Zu we/you/they gehört 'are'."},{"q":"___ you hungry?","opts":["Is","Am","Are","Do"],"a":2,"why":"Frage mit you: Are you ...?"},{"q":"They ___ at work today.","opts":["is","are","am","does"],"a":1,"why":"They -> are."},{"q":"My brother ___ not at home.","opts":["are","am","do","is"],"a":3,"why":"My brother = he -> is not."},{"q":"Welcher Satz ist richtig?","opts":["I have cold.","I am cold.","I cold am.","I do cold."],"a":1,"why":"Gefühle mit 'to be': I am cold."},{"q":"Welcher Satz ist richtig?","opts":["He have 25 y
