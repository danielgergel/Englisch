:"heb es auf – Wörter fließen","ex":"Pick it up, please.","exde":"Heb es bitte auf.","say":"pi-ki-dap","lvl":3}]},"dict":[{"en":"What are you doing tonight?","heard":"Whatcha doin' tonight?","de":"Was machst du heute Abend?","lvl":1},{"en":"I don't know what to say.","heard":"I dunno what ta say.","de":"Ich weiß nicht, was ich sagen soll.","lvl":1},{"en":"Come on, let's go home.","heard":"C'mon, let's go home.","de":"Komm schon, lass uns nach Hause gehen.","lvl":1},{"en":"Do you want some water?","heard":"D'you want some water?","de":"Willst du etwas Wasser?","lvl":1},{"en":"I want to go to bed.","heard":"I wanna go ta bed.","de":"Ich will ins Bett gehen.","lvl":1},{"en":"See you tomorrow, okay?","heard":"See ya tomorrow, 'kay?","de":"Bis morgen, ok?","lvl":1},{"en":"Give me the phone, please.","heard":"Gimme the phone, please.","de":"Gib mir bitte das Telefon.","lvl":1},{"en":"What is your name again?","heard":"What's yer name again?","de":"Wie war noch mal dein Name?","lvl":1},{"en":"I have to go now.","heard":"I hafta go now.","de":"Ich muss jetzt gehen.","lvl":1},{"en":"Let me see that picture.","heard":"Lemme see that picture.","de":"Lass mich das Bild sehen.","lvl":1},{"en":"Are you going to the party?","heard":"You goin' ta the party?","de":"Gehst du zur Party?","lvl":1},{"en":"I am going to call my mom.","heard":"I'm gonna call my mom.","de":"Ich rufe meine Mama an.","lvl":1},{"en":"Wait until I come back.","heard":"Wait 'til I come back.","de":"Warte, bis ich zurückkomme.","lvl":1},{"en":"Thank you for your help.","heard":"Thank ya fer yer help.","de":"Danke für deine Hilfe.","lvl":1},{"en":"What is up with you today?","heard":"Wassup with ya today?","de":"Was ist heute mit dir los?","lvl":1},{"en":"Where do you want to eat?","heard":"Where d'ya wanna eat?","de":"Wo willst du essen?","lvl":2},{"en":"I am not sure about that.","heard":"I ain't sure 'bout that.","de":"Da bin ich mir nicht sicher.","lvl":2},{"en":"Did you see the new episode?","heard":"Didja see the new episode?","de":"Hast du die neue Folge gesehen?","lvl":2},{"en":"I have got to finish this report.","heard":"I gotta finish this report.","de":"Ich muss diesen Bericht fertig machen.","lvl":2},{"en":"It is kind of hard to explain.","heard":"It's kinda hard ta explain.","de":"Es ist irgendwie schwer zu erklären.","lvl":2},{"en":"Tell them I am running late.","heard":"Tell 'em I'm runnin' late.","de":"Sag ihnen, ich komme spät.","lvl":2},{"en":"I could not sleep last night.","heard":"I couldn't sleep last night.","de":"Ich konnte letzte Nacht nicht schlafen.","lvl":2},{"en":"What do you think about this?","heard":"Whaddaya think 'bout this?","de":"Was hältst du davon?","lvl":2},{"en":"Do you know where my keys are?","heard":"D'ya know where my keys are?","de":"Weißt du, wo meine Schlüssel sind?","lvl":2},{"en":"I will see you around noon.","heard":"I'll see ya 'round noon.","de":"Wir sehen uns gegen Mittag.","lvl":2},{"en":"We are out of coffee again.","heard":"We're outta coffee again.","de":"Uns ist schon wieder der Kaffee ausgegangen.","lvl":2},{"en":"Let me know when you get there.","heard":"Lemme know when ya get there.","de":"Sag mir Bescheid, wenn du da bist.","lvl":2},{"en":"I am just looking around.","heard":"I'm just lookin' 'round.","de":"Ich schaue mich nur um.","lvl":2},{"en":"Because it is raining outside.","heard":"'Cause it's rainin' outside.","de":"Weil es draußen regnet.","lvl":2},{"en":"You should call him back.","heard":"Ya should call 'im back.","de":"Du solltest ihn zurückrufen.","lvl":2},{"en":"Would you like another coffee?","heard":"Wouldja like another coffee?","de":"Möchtest du noch einen Kaffee?","lvl":2},{"en":"I used to play guitar in a band.","heard":"I useta play guitar in a band.","de":"Ich habe früher in einer Band Gitarre gespielt.","lvl":3},{"en":"You should have told me earlier.","heard":"You shoulda told me earlier.","de":"Du hättest es mir früher sagen sollen.","lvl":3},{"en":"I am trying to focus right now.","heard":"I'm tryna focus right now.","de":"Ich versuche gerade, mich zu konzentrieren.","lvl":3},{"en":"Could you close the window, please?","heard":"Couldja close the window, please?","de":"Könntest du bitte das Fenster schließen?","lvl":3},{"en":"I think we ought to leave soon.","heard":"I think we oughta leave soon.","de":"Ich denke, wir sollten bald gehen.","lvl":3},{"en":"That is a whole other story.","heard":"That's a whole 'nother story.","de":"Das ist eine ganz andere Geschichte.","lvl":3},{"en":"She would have come if you asked.","heard":"She woulda come if ya asked.","de":"Sie wäre gekommen, wenn du gefragt hättest.","lvl":3},{"en":"I bet you cannot guess what happened.","heard":"Betcha can't guess what happened.","de":"Ich wette, du errätst nicht, was passiert ist.","lvl":3},{"en":"Don't you think it's too expensive?","heard":"Dontcha think it's too expensive?","de":"Findest du das nicht zu teuer?","lvl":3},{"en":"We have a lot of work to do.","heard":"We got a lotta work ta do.","de":"Wir haben eine Menge Arbeit vor uns.","lvl":3},{"en":"I am about to leave the house.","heard":"I'm finna leave the house.","de":"Ich verlasse gleich das Haus.","lvl":3},{"en":"He must have forgotten about it.","heard":"He musta forgot about it.","de":"Er muss es vergessen haben.","lvl":3},{"en":"What did you do last weekend?","heard":"Whaddja do last weekend?","de":"Was hast du letztes Wochenende gemacht?","lvl":3},{"en":"I'm sorry, I did not mean to.","heard":"I'm sorry, I didn't mean ta.","de":"Tut mir leid, das wollte ich nicht.","lvl":3},{"en":"You are supposed to wait here.","heard":"You're supposta wait here.","de":"Du sollst hier warten.","lvl":3},{"en":"I don't know, honestly. No idea.","heard":"I dunno, honestly. No idea.","de":"Ich weiß es ehrlich gesagt nicht. Keine Ahnung.","lvl":3},{"en":"Give me a minute and I will explain.","heard":"Gimme a minute an' I'll explain.","de":"Gib mir eine Minute, dann erkläre ich es.","lvl":3},{"en":"They said that you could not come.","heard":"They said ya couldn't come.","de":"Sie sagten, du könntest nicht kommen.","lvl":3},{"en":"I got to say, that was impressive.","heard":"I gotta say, that was impressive.","de":"Ich muss sagen, das war beeindruckend.","lvl":3},{"en":"Why did you not tell me before?","heard":"Why didn't ya tell me before?","de":"Warum hast du es mir nicht vorher gesagt?","lvl":3},{"en":"It might have been a misunderstanding.","heard":"It mighta been a misunderstandin'.","de":"Es könnte ein Missverständnis gewesen sein.","lvl":4},{"en":"How did you manage to finish so early?","heard":"Howdya manage ta finish so early?","de":"Wie hast du es geschafft, so früh fertig zu werden?","lvl":4},{"en":"I would have gone if I had known.","heard":"I woulda gone if I'd known.","de":"Ich wäre gegangen, wenn ich es gewusst hätte.","lvl":4},{"en":"You have got to be kidding me.","heard":"You gotta be kiddin' me.","de":"Das kann nicht dein Ernst sein.","lvl":4},{"en":"What do you want me to do about it?","heard":"Whaddaya want me ta do 'bout it?","de":"Was soll ich deiner Meinung nach dagegen tun?","lvl":4},{"en":"I suppose that could work, though.","heard":"I s'pose that could work, though.","de":"Ich nehme an, das könnte klappen.","lvl":4},{"en":"Did you eat yet, or should we order?","heard":"Jeet yet, or should we order?","de":"Hast du schon gegessen, oder sollen wir bestellen?","lvl":4},{"en":"I had to cancel because of the weather.","heard":"I hadda cancel 'cause of the weather.","de":"Ich musste wegen des Wetters absagen.","lvl":4},{"en":"Where have you been all this time?","heard":"Where ya been all this time?","de":"Wo warst du die ganze Zeit?","lvl":4},{"en":"It's kind of a big deal, you know.","heard":"It's kinda a big deal, y'know.","de":"Es ist schon eine ziemlich große Sache, weißt du.","lvl":4},{"en":"Would you mind if I opened a window?","heard":"Wouldja mind if I opened a window?","de":"Hättest du etwas dagegen, wenn ich ein Fenster öffne?","lvl":2},{"en":"I was going to tell you, but I forgot.","heard":"I was gonna tell ya, but I forgot.","de":"Ich wollte es dir sagen, hab es aber vergessen.","lvl":4},{"en":"Don't you dare walk out of here.","heard":"Don'tcha dare walk outta here.","de":"Wage es ja nicht, hier rauszugehen.","lvl":4},{"en":"Sort of makes sense when you think about it.","heard":"Sorta makes sense when ya think 'bout it.","de":"Wenn man darüber nachdenkt, ergibt es irgendwie Sinn.","lvl":4},{"en":"She probably did not see the message.","heard":"She prolly didn't see the message.","de":"Sie hat die Nachricht wahrscheinlich nicht gesehen.","lvl":4},{"en":"I'm not going to let that slide.","heard":"I'm not gonna let that slide.","de":"Das lasse ich nicht einfach durchgehen.","lvl":4},{"en":"Out of all the places, you chose this one?","heard":"Outta all the places, ya chose this one?","de":"Von allen Orten hast du ausgerechnet diesen gewählt?","lvl":5},{"en":"If I had known, I would have said something.","heard":"If I'da known, I woulda said somethin'.","de":"Wenn ich es gewusst hätte, hätte ich etwas gesagt.","lvl":5},{"en":"What are you trying to get at, exactly?","heard":"Whatcha tryna get at, exactly?","de":"Worauf willst du genau hinaus?","lvl":5},{"en":"You ought to have seen the look on his face.","heard":"Ya oughta've seen the look on his face.","de":"Du hättest sein Gesicht sehen sollen.","lvl":5},{"en":"Let me tell you what I think of that idea.","heard":"Lemme tell ya what I think of that idea.","de":"Lass mich dir sagen, was ich von der Idee halte.","lvl":5},{"en":"I don't know what you want me to say.","heard":"I dunno whatcha want me ta say.","de":"Ich weiß nicht, was du von mir hören willst.","lvl":5},{"en":"Where did you get a chance to practice that?","heard":"Where'dja get a chance ta practice that?","de":"Wo hattest du die Gelegenheit, das zu üben?","lvl":5},{"en":"It could have gone a lot worse, to be honest.","heard":"It coulda gone a lotta worse, ta be honest.","de":"Es hätte ehrlich gesagt viel schlimmer laufen können.","lvl":5},{"en":"I'm going to give it a shot, whether you like it or not.","heard":"I'm gonna give it a shot, whether ya like it or not.","de":"Ich probiere es aus, ob es dir gefällt oder nicht.","lvl":5},{"en":"Because of you, I got to see the whole thing.","heard":"'Cause of ya, I got ta see the whole thing.","de":"Dank dir konnte ich das Ganze sehen.","lvl":5},{"en":"I want to see a movie tonight.","heard":"I wanna see a movie tonight.","de":"Ich möchte heute Abend einen Film sehen.","lvl":2},{"en":"Let me help you with that bag.","heard":"Lemme help ya with that bag.","de":"Lass mich dir mit der Tasche helfen.","lvl":2},{"en":"What do you want for dinner?","heard":"Whaddaya want fer dinner?","de":"Was möchtest du zum Abendessen?","lvl":2}],"songs":[{"id":"s1","lvl":1,"title":"Home Tonight (Original)","style":"Pop","lines":[{"en":"I'm coming home tonight","de":"Ich komme heute Nacht nach Hause"},{"en":"The street is quiet and the stars are bright","de":"Die Straße ist still und die Sterne leuchten hell"},{"en":"I miss your smile, I miss your voice","de":"Ich vermisse dein Lächeln, ich vermisse deine Stimme"},{"en":"Every day I make the same choice","de":"Jeden Tag treffe ich dieselbe Wahl"},{"en":"I want to be with you","de":"Ich will bei dir sein"},{"en":"Open the door, I'm coming through","de":"Mach die Tür auf, ich komme rein"}],"gaps":[{"line":0,"word":"coming"},{"line":2,"word":"smile"},{"line":4,"word":"want"}],"culture":"Einfache Pop-Texte nutzen kurze Sätze und Reime (night/bright, voice/choice). 'I miss you' ist eine der häufigsten Zeilen in Songs."},{"id":"s2","lvl":1,"title":"Sunny Day (Original)","style":"Pop","lines":[{"en":"The sun is up, the sky is blue","de":"Die Sonne ist da, der Himmel ist blau"},{"en":"I'm feeling good, and so are you","de":"Mir geht es gut, und dir auch"},{"en":"Let's dance in the street all day","de":"Lass uns den ganzen Tag auf der Straße tanzen"},{"en":"Nothing can take this joy away","de":"Nichts kann diese Freude wegnehmen"},{"en":"Sing it loud, sing it clear","de":"Sing es laut, sing es klar"},{"en":"Happy days are finally here","de":"Glückliche Tage sind endlich da"}],"gaps":[{"line":0,"word":"sky"},{"line":2,"word":"dance"},{"line":4,"word":"loud"}],"culture":"Gute-Laune-Songs arbeiten mit Wetter-Bildern (sun, blue sky) als Symbol für Glück. Imperativ-Zeilen wie 'Let's dance' laden zum Mitmachen ein."},{"id":"s3","lvl":1,"title":"Call Me Back (Original)","style":"Pop","lines":[{"en":"I called you twice, you didn't pick up","de":"Ich habe dich zweimal angerufen, du bist nicht rangegangen"},{"en":"Where are you now, what's going on","de":"Wo bist du jetzt, was ist los"},{"en":"Call me back, call me back","de":"Ruf mich zurück, ruf mich zurück"},{"en":"I just need to hear your voice","de":"Ich muss nur deine Stimme hören"},{"en":"Text me something, anything","de":"Schreib mir irgendetwas"},{"en":"Tell me that we're still okay","de":"Sag mir, dass bei uns noch alles gut ist"}],"gaps":[{"line":0,"word":"twice"},{"line":3,"word":"voice"},{"line":4,"word":"Text"}],"culture":"'Pick up' (ans Telefon gehen) und 'text me' (mir schreiben) sind typische moderne Phrasen. Wiederholungen wie 'call me back' bilden den Refrain."},{"id":"s4","lvl":1,"title":"Dream Big (Original)","style":"Pop","lines":[{"en":"Close your eyes and make a wish","de":"Schließ die Augen und wünsch dir etwas"},{"en":"Tomorrow is a brand new day","de":"Morgen ist ein ganz neuer Tag"},{"en":"You can be what you want to be","de":"Du kannst sein, was du sein willst"},{"en":"Don't let anyone say no","de":"Lass dir von niemandem Nein sagen"},{"en":"Dream big, dream big","de":"Träum groß, träum groß"},{"en":"The world is waiting for you","de":"Die Welt wartet auf dich"}],"gaps":[{"line":0,"word":"wish"},{"line":1,"word":"new"},{"line":4,"word":"big"}],"culture":"Motivationssongs sprechen den Hörer direkt mit 'you' an. 'Make a wish' ist ein festes Bild: sich bei Geburtstagskerzen oder Sternschnuppen etwas wünschen."},{"id":"s5","lvl":2,"title":"Midnight Road (Original)","style":"Pop","lines":[{"en":"I'm driving through the night, gotta clear my mind","de":"Ich fahre durch die Nacht, muss meinen Kopf frei kriegen"},{"en":"The radio is playing songs that remind me of you","de":"Im Radio laufen Songs, die mich an dich erinnern"},{"en":"I wanna turn around but I know I can't","de":"Ich will umdrehen, aber ich weiß, dass ich nicht kann"},{"en":"Yesterday is gone and I'm movin' on","de":"Gestern ist vorbei und ich mache weiter"},{"en":"Lights are flashing by like a movie scene","de":"Lichter rauschen vorbei wie in einer Filmszene"},{"en":"I'm leaving all my doubts behind","de":"Ich lasse alle Zweifel hinter mir"},{"en":"Midnight road, take me where I belong","de":"Mitternachtsstraße, bring mich dorthin, wo ich hingehöre"}],"gaps":[{"line":0,"word":"clear"},{"line":3,"word":"gone"},{"line":5,"word":"doubts"}],"culture":"Typische Songsprache: Verschleifungen wie 'gotta', 'wanna', 'movin''. Die Straße und die Nacht stehen oft für Neuanfang und Loslassen."},{"id":"s6","lvl":2,"title":"Coffee and Rain (Original)","style":"Pop","lines":[{"en":"Sunday morning, coffee and rain","de":"Sonntagmorgen, Kaffee und Regen"},{"en":"You're still sleeping, I'm watching the window","de":"Du schläfst noch, ich schaue aus dem Fenster"},{"en":"Nobody calls, nobody knocks","de":"Niemand ruft an, niemand klopft"},{"en":"It's just us in our little world","de":"Es sind nur wir in unserer kleinen Welt"},{"en":"I could stay like this forever","de":"Ich könnte für immer so bleiben"},{"en":"Slow down, time, don't take this away","de":"Langsamer, Zeit, nimm das nicht weg"}],"gaps":[{"line":1,"word":"sleeping"},{"line":2,"word":"knocks"},{"line":4,"word":"forever"}],"culture":"Ruhige Popsongs zeichnen kleine Alltagsszenen. Mit Personifikation wie 'Slow down, time' wird die Zeit direkt angesprochen."},{"id":"s7","lvl":2,"title":"Friday Feeling (Original)","style":"Pop","lines":[{"en":"Five o'clock, I'm out the door","de":"Fünf Uhr, ich bin zur Tür raus"},{"en":"Friday night, I want some more","de":"Freitagabend, ich will mehr"},{"en":"Call the crew, we're hitting the town","de":"Ruf die Crew an, wir ziehen durch die Stadt"},{"en":"Nobody's gonna bring us down","de":"Niemand wird uns runterziehen"},{"en":"Turn it up, turn the music loud","de":"Dreh auf, mach die Musik laut"},{"en":"We're the kings of the crowd","de":"Wir sind die Könige der Menge"}],"gaps":[{"line":2,"word":"crew"},{"line":3,"word":"gonna"},{"line":4,"word":"music"}],"culture":"'Hit the town' bedeutet ausgehen und feiern. Party-Songs nutzen kurze Reimzeilen und Imperative wie 'turn it up'."},{"id":"s8","lvl":2,"title":"Without You (Original)","style":"Ballade","lines":[{"en":"The house feels empty since you left","de":"Das Haus fühlt sich leer an, seit du weg bist"},{"en":"Your coffee cup is still on the shelf","de":"Deine Kaffeetasse steht noch im Regal"},{"en":"I don't know how to be alone","de":"Ich weiß nicht, wie man allein ist"},{"en":"I keep on staring at my phone","de":"Ich starre immer wieder auf mein Handy"},{"en":"Maybe you'll call, maybe you won't","de":"Vielleicht rufst du an, vielleicht nicht"},{"en":"But I'll be here, I'll be here","de":"Aber ich bin hier, ich bin hier"}],"gaps":[{"line":0,"word":"empty"},{"line":2,"word":"alone"},{"line":3,"word":"staring"}],"culture":"Trennungsballaden erzählen über kleine Gegenstände (Tasse, Handy), die an die Person erinnern. 'I keep on + -ing' beschreibt ein Gewohnheitsverhalten."},{"id":"s9","lvl":2,"title":"Summer Town (Original)","style":"Pop","lines":[{"en":"We rode our bikes down to the sea","de":"Wir sind mit den Rädern zum Meer gefahren"},{"en":"Salt in the air, sand on our feet","de":"Salz in der Luft, Sand an den Füßen"},{"en":"You laughed so hard you couldn't breathe","de":"Du hast so gelacht, dass du keine Luft bekamst"},{"en":"That summer day is all I need","de":"Dieser Sommertag ist alles, was ich brauche"},{"en":"Take me back to the summer town","de":"Bring mich zurück in die Sommerstadt"},{"en":"Where nothing could ever bring us down","de":"Wo uns nichts je runterziehen konnte"}],"gaps":[{"line":0,"word":"bikes"},{"line":2,"word":"breathe"},{"line":4,"word":"summer"}],"culture":"Nostalgie-Songs blicken auf vergangene Sommer zurück, meist mit Past Simple. 'Bring someone down' heißt jemanden deprimieren."},{"id":"s10","lvl":2,"title":"Count on Me (Original)","style":"Pop","lines":[{"en":"When the road gets rough and the night gets long","de":"Wenn der Weg holprig wird und die Nacht lang"},{"en":"I'll be there, I'll be your song","de":"Ich werde da sein, ich werde dein Song sein"},{"en":"You can count on me, count on me","de":"Du kannst auf mich zählen, auf mich zählen"},{"en":"Through the sun and through the storm","de":"Durch Sonne und durch Sturm"},{"en":"I won't let you fall","de":"Ich lasse dich nicht fallen"},{"en":"I won't let you fall apart","de":"Ich lasse dich nicht zerbrechen"}],"gaps":[{"line":0,"word":"rough"},{"line":2,"word":"count"},{"line":4,"word":"fall"}],"culture":"'Count on someone' (sich auf jemanden verlassen) ist ein häufiger Freundschaftsspruch in Songs. Sturm und Sonne stehen für gute und schlechte Zeiten."},{"id":"s11","lvl":3,"title":"Neon Lights (Original)","style":"Pop","lines":[{"en":"Neon lights on the wet pavement tonight","de":"Neonlichter auf dem nassen Pflaster heute Nacht"},{"en":"I'm chasing a feeling I can't quite explain","de":"Ich jage einem Gefühl hinterher, das ich nicht ganz erklären kann"},{"en":"Everybody's dancing but I'm lost in thought","de":"Alle tanzen, aber ich bin in Gedanken versunken"},{"en":"Wondering if you ever think of me","de":"Ich frage mich, ob du je an mich denkst"},{"en":"Tell me what it takes to make you stay","de":"Sag mir, was es braucht, damit du bleibst"},{"en":"'Cause I'm running out of ways to say it","de":"Denn mir gehen die Worte aus, es zu sagen"},{"en":"Neon lights, don't let me fade away","de":"Neonlichter, lass mich nicht verblassen"}],"gaps":[{"line":1,"word":"chasing"},{"line":2,"word":"lost"},{"line":5,"word":"running"}],"culture":"Stadt-Nacht-Bilder (neon, wet pavement) schaffen Stimmung. 'Run out of' (etwas geht aus) und 'lost in thought' sind feste Wendungen."},{"id":"s12","lvl":3,"title":"Second Chance (Original)","style":"Ballade","lines":[{"en":"I know I let you down last year","de":"Ich weiß, ich habe dich letztes Jahr enttäuscht"},{"en":"I should've listened when you cried","de":"Ich hätte zuhören sollen, als du geweint hast"},{"en":"Now I'm standing at your door again","de":"Jetzt stehe ich wieder vor deiner Tür"},{"en":"With nothing but a promise in my hands","de":"Mit nichts als einem Versprechen in den Händen"},{"en":"Give me one more chance to make it right","de":"Gib mir noch eine Chance, es richtig zu machen"},{"en":"I'll change, I swear, I'll change","de":"Ich ändere mich, ich schwöre, ich ändere mich"}],"gaps":[{"line":0,"word":"let"},{"line":1,"word":"listened"},{"line":4,"word":"chance"}],"culture":"'Let someone down' heißt jemanden enttäuschen. Reue-Songs nutzen 'should've' (should have) und Schwüre wie 'I swear'."},{"id":"s13","lvl":3,"title":"Runaway Train (Original)","style":"Rock","lines":[{"en":"I've been running on empty for too long","de":"Ich laufe schon zu lange auf Reserve"},{"en":"My heart's a train that's off the track","de":"Mein Herz ist ein Zug, der aus den Schienen ist"},{"en":"They say I'm crazy but I don't care","de":"Sie sagen, ich bin verrückt, aber das ist mir egal"},{"en":"I'm done pretending that I'm fine","de":"Ich habe keine Lust mehr, so zu tun, als ginge es mir gut"},{"en":"Pull the brakes or let me burn","de":"Zieh die Bremse oder lass mich brennen"},{"en":"Runaway train, I'm never coming back","de":"Außer Kontrolle geratener Zug, ich komme nie zurück"}],"gaps":[{"line":0,"word":"empty"},{"line":2,"word":"crazy"},{"line":3,"word":"pretending"}],"culture":"Rocksongs nutzen kräftige Metaphern (Zug außer Kontrolle) für Gefühlschaos. 'Be done with something' bedeutet, genug davon zu haben."},{"id":"s14","lvl":3,"title":"City Kid (Original)","style":"Hip-Hop","lines":[{"en":"Grew up on a block where the lights never slept","de":"Aufgewachsen in einem Block, wo das Licht nie schlief"},{"en":"Mama worked two jobs so we could eat","de":"Mama hatte zwei Jobs, damit wir essen konnten"},{"en":"Now I'm on the grind, chasing my dream","de":"Jetzt ackere ich und jage meinen Traum"},{"en":"Every setback made me stronger","de":"Jeder Rückschlag hat mich stärker gemacht"},{"en":"They doubted me, but I kept my faith","de":"Sie haben an mir gezweifelt, aber ich habe meinen Glauben behalten"},{"en":"Look at me now, I'm finally free","de":"Schau mich jetzt an, ich bin endlich frei"}],"gaps":[{"line":0,"word":"block"},{"line":2,"word":"grind"},{"line":3,"word":"setback"}],"culture":"Hip-Hop erzählt oft eine Aufstiegsgeschichte aus einfachen Verhältnissen. 'The grind' ist Slang für harte, ständige Arbeit, 'block' meint das Wohnviertel."},{"id":"s15","lvl":3,"title":"Paper Planes (Original)","style":"Pop","lines":[{"en":"We folded all our secrets into paper planes","de":"Wir falteten all unsere Geheimnisse zu Papierfliegern"},{"en":"And threw them from the rooftop to the rain","de":"Und warfen sie vom Dach in den Regen"},{"en":"Nobody knew what we were running from","de":"Niemand wusste, wovor wir weggelaufen sind"},{"en":"But we were young and we were free","de":"Aber wir waren jung und frei"},{"en":"Now the years have flown away","de":"Jetzt sind die Jahre davongeflogen"},{"en":"I wonder where those planes ended up","de":"Ich frage mich, wo die Flieger gelandet sind"}],"gaps":[{"line":0,"word":"folded"},{"line":2,"word":"running"},{"line":5,"word":"wonder"}],"culture":"Songs verwenden gerne ein zentrales Bild (Papierflieger) als Symbol für Jugend und Erinnerung. 'End up' bedeutet irgendwo landen."},{"id":"s16","lvl":3,"title":"Break the Silence (Original)","style":"Rock","lines":[{"en":"We sit in silence at the kitchen table rn wirken"},{"en":"I'm learning to let go, but not tonight","de":"Ich lerne loszulassen, aber nicht heute Nacht"}],"gaps":[{"line":0,"word":"swore"},{"line":1,"word":"haunted"},{"line":2,"word":"slipped"}],"culture":"'Haunted by' und 'slip through one's fingers' sind bildhafte Wendungen für verlorene Liebe. Sommerlieder verbinden Wehmut mit Flüchtigkeit."}]};

<script>
/* ===== Kern: Hilfsfunktionen, Zustand, Daten, Sprache, Lernlogik ===== */
const LV=["","A1","A2","B1","B2","C1"];
const DAY=864e5;
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dayKey(t){const d=new Date(t||Date.now());return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayStart(t){const d=new Date(t||Date.now());d.setHours(0,0,0,0);return d.getTime();}
function cefr(L){return LV[Math.max(1,Math.min(5,Math.round(L)))];}
function cefrExact(L){return L<1.5?"A1":L<2.5?"A2":L<3.5?"B1":L<4.5?"B2":"C1";}

/* ---------- Zustand ---------- */
const KEY="englisch-v1";
let S;
function defaults(){return{v:1,created:Date.now(),placed:false,L:2,Lhist:[],cards:{},gram:{},dict:{},xp:0,streak:0,best:0,lastDay:"",days:{},today:{d:"",done:{}},
  set:{goal:30,acc:"en-US",rate:0.9,theme:"auto",showDe:true,voice:"",autoNext:true},acc:[],media:0,pq:[],lastBackup:0,seen:{},tests:[]};}
function load(){
  let o={};try{o=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){try{localStorage.setItem(KEY+"-corrupt",localStorage.getItem(KEY));}catch(x){}}
  const d=defaults();S=Object.assign(d,o);S.set=Object.assign(defaults().set,o.set||{});
  if(!S.today||S.today.d!==dayKey()){S.today={d:dayKey(),done:{}};}
}
let saveT,frozen=false;
function freezeSave(){frozen=true;clearTimeout(saveT);}
function save(now){if(frozen)return;clearTimeout(saveT);const f=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};if(now)f();else saveT=setTimeout(f,250);}
function dayRec(k){k=k||dayKey();return S.days[k]||(S.days[k]={sec:0,xp:0,n:0,ok:0});}
function streakNow(){const t=dayKey(),y=dayKey(Date.now()-DAY);return(S.lastDay===t||S.lastDay===y)?S.streak:0;}
function touchStreak(){
  const k=dayKey();if(S.lastDay===k)return;
  if(dayRec(k).sec>=300){S.streak=(S.lastDay===dayKey(Date.now()-DAY))?S.streak+1:1;S.lastDay=k;S.best=Math.max(S.best,S.streak);}
}

/* ---------- Daten aufbauen ---------- */
const ITEMS={},POOL={v:[],c:[],r:[],s:[],p:[]};
function addItem(t,o){
  if(!o||!o.en||!o.de)return;
  o.lvl=Math.max(1,Math.min(5,(o.lvl|0)||2));
  const k=t+":"+o.en;if(ITEMS[k])return;
  o.t=t;o.k=k;ITEMS[k]=o;POOL[t].push(o);
}
(function build(){
  const A=x=>Array.isArray(x)?x:[];
  A(D.vocab).forEach(x=>addItem("v",x));
  A(D.chunks).forEach(x=>addItem("c",x));
  const L=D.listening||{};
  A(L.reductions).forEach(x=>addItem("r",{en:x.spoken,full:x.full,de:x.full+(x.de?"  ·  "+x.de:""),ex:x.ex,exde:x.exde,say:x.say,lvl:x.lvl||2,cat:"alltag"}));
  A(D.sentences).forEach(x=>addItem("s",x));
  A(D.dialogues).forEach(d=>A(d.phrases).forEach(p=>addItem("p",{en:p.en,de:p.de,note:p.note,lvl:d.lvl,cat:"alltag"})));
})();

/* ---------- Text-Vergleich ---------- */
const CONTR={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","i'd":"i would","you'd":"you would","he'd":"he would","she'd":"she would","we'd":"we would","they'd":"they would","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","wouldn't":"would not","shouldn't":"should not","couldn't":"could not","haven't":"have not","hasn't":"has not","hadn't":"had not","mustn't":"must not","let's":"let us","that's":"that is","there's":"there is","what's":"what is","where's":"where is","who's":"who is","here's":"here is"};
(function(){const skip={its:1,were:1,ill:1,id:1,hell:1,shell:1,well:1,wed:1,wont:1,lets:1,shed:1,hed:1};
  Object.keys(CONTR).slice().forEach(k=>{const n=k.replace(/'/g,"");if(n!==k&&!skip[n]&&!CONTR[n])CONTR[n]=CONTR[k];});})();
function norm(s){
  s=String(s).toLowerCase().replace(/[‘’`´]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
  return s.split(" ").map(w=>CONTR[w]||w).join(" ").replace(/\s+/g," ");
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[n];
}
function judge(user,targets){
  const u=norm(user);if(!u)return{r:"empty"};
  let best=null;
  for(const t of targets){const n=norm(t);if(n===u)return{r:"ok",t};const d=lev(u,n);if(!best||d<best.d)best={d,t,n};}
  const L=best.n.length,tol=L<5?0:L<=20?1:2;
  if(best.d<=tol)return{r:"typo",t:best.t};
  return{r:"bad",t:targets[0]};
}
function variants(en){
  const out=new Set();
  String(en).split(/\s*[\/;]\s*/).forEach(p=>{p=p.trim();if(!p)return;out.add(p);out.add(p.replace(/^to /,""));out.add(p.replace(/\s*\([^)]*\)/g,"").trim());});
  return[...out].filter(Boolean);
}
function stemRe(en){
  const base=en.replace(/^to /,"").replace(/\s*\(.*?\)/g,"").trim();if(!base)return null;
  const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const words=base.split(/\s+/);
  const stem=w=>{if(w.length>4&&/[^aeiou]y$/.test(w))return w.slice(0,-1);if(w.length>3&&/e$/.test(w))return w.slice(0,-1);return w;};
  try{
    if(words.length===1)return new RegExp("\\b"+esc(stem(words[0]))+"\\w*","i");
    return new RegExp("\\b"+esc(stem(words[0]))+"\\w*\\s+(?:\\w+\\s+)?"+words.slice(1).map(esc).join("\\s+"),"i");
  }catch(e){return null;}
}
function diffNode(user,target){
  const tw=target.split(/\s+/),uset=new Set(norm(user).split(" "));
  const tset=new Set(norm(target).split(" "));
  const t=h("div",{class:"diff"},tw.map(w=>h("span",{class:uset.has(norm(w))?"":"miss"},w+" ")));
  const u=h("div",{class:"diff you"},user.split(/\s+/).filter(Boolean).map(w=>h("span",{class:tset.has(norm(w))?"":"wrong"},w+" ")));
  return[u,t];
}

/* ---------- Sprachausgabe & Spracheingabe ---------- */
let ttsTok=0;
const TTS={voices:[],unlocked:false,
  load(){try{this.voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));}catch(e){this.voices=[];}},
  list(){const pref=this.voices.filter(v=>v.lang.replace("_","-").toLowerCase()===S.set.acc.toLowerCase());
    const sc=v=>(/premium|enhanced|neural/i.test(v.name)?3:0)+(/samantha|daniel|karen|ava|allison|serena|moira|susan|nicky|alex/i.test(v.name)?1:0)+(v.localService?0.5:0);
    return(pref.length?pref:this.voices).slice().sort((a,b)=>sc(b)-sc(a));},
  pick(i){
    if(i===0&&S.set.voice){const f=this.voices.find(v=>v.voiceURI===S.set.voice);if(f)return f;}
    const l=this.list();return l.length?l[i%l.length]:null;},
  speak(text,o){
    o=o||{};
    if(!("speechSynthesis"in window))return Promise.resolve();
    const my=++ttsTok;
    return new Promise(res=>{
      try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}
      const u=new SpeechSynthesisUtterance(String(text).replace(/\s*\/\s*/g,", "));
      u.lang=S.set.acc;const v=this.pick(o.voice||0);if(v){u.voice=v;u.lang=v.lang;}
      u.rate=Math.max(0.3,(o.rate||1)*S.set.rate);u.pitch=o.pitch||1;
      let fin=false;const end=()=>{if(!fin){fin=true;res(my===ttsTok);}};
      u.onend=end;u.onerror=end;
      setTimeout(end,Math.max(4000,String(text).length*140/(u.rate||1)+2000));
      setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){end();}},40);
    });},
  stop(){try{speechSynthesis.cancel();}catch(e){}}};
addEventListener("pointerdown",()=>{if(!TTS.unlocked&&"speechSynthesis"in window){TTS.unlocked=true;try{const x=new SpeechSynthesisUtterance(" ");x.volume=0;speechSynthesis.speak(x);}catch(e){}}},{once:true,capture:true});
if("speechSynthesis"in window){TTS.load();try{speechSynthesis.onvoiceschanged=()=>TTS.load();}catch(e){}}
const SRClass=window.SpeechRecognition||window.webkitSpeechRecognition;
let noSR=false;
function canListen(){return !!SRClass&&!noSR;}
function listenOnce(){
  return new Promise((res,rej)=>{
    let done=false,r,tm;
    try{r=new SRClass();}catch(e){return rej(e);}
    r.lang="en-US";r.interimResults=false;r.maxAlternatives=4;
    r.onresult=e=>{done=true;res([...e.results[0]].map(a=>a.transcript));};
    r.onerror=e=>{if(!done){done=true;if(/not-allowed|service-not-allowed|audio-capture/.test(e.error))noSR=true;rej(new Error(e.error));}};
    r.onend=()=>{clearTimeout(tm);if(!done){done=true;rej(new Error("no-speech"));}};
    try{r.start();}catch(e){rej(e);}
    tm=setTimeout(()=>{try{r.stop();}catch(e){}},9000);
  });
}

/* ---------- Karten / Wiederholung (Leitner-System) ---------- */
const IV=[0,1,2,4,8,16,32,64];
function card(k){return S.cards[k]||(S.cards[k]={b:0,due:0,ok:0,bad:0,t:0});}
function grade(k,ok){
  const c=card(k);c.t=Date.now();
  if(ok){c.ok++;c.b=Math.min(7,c.b+1);}else{c.bad++;c.b=Math.max(1,c.b-2);}
  c.due=dayStart()+IV[c.b]*DAY;
}

function pickNew(types,n){
  const lo=Math.max(1,Math.round(S.L-1)),hi=Math.min(5,Math.round(S.L+0.5));
  const fresh=x=>!S.cards[x.k]||S.cards[x.k].b===0;
  let c=[];types.forEach(t=>POOL[t].forEach(x=>{if(fresh(x)&&x.lvl>=lo&&x.lvl<=hi)c.push(x);}));
  if(c.length<n){types.forEach(t=>POOL[t].forEach(x=>{if(fresh(x)&&!c.includes(x))c.push(x);}));}
  c=c.map(x=>({x,s:Math.abs(x.lvl-S.L)+Math.random()*1.1})).sort((a,b)=>a.s-b.s).map(o=>o.x);
  return c.slice(0,n);

  const ok=x=>x!==it&&x[field]&&x[field]!==it[field]&&x.en.startsWith("to ")===isTo&&(field!=="de"||x.de.length<80);
  const near=shuffle(pool.filter(x=>ok(x)&&(x.cat===it.cat||Math.abs(x.lvl-it.lvl)<=1)));

/* ---------- Session-Runner ---------- */
function runQueue(title,tasks,opt){
  opt=opt||{};
  return new Promise(resolve=>{
    const root=h("div",{id:"sess",role:"dialog","aria-label":title});
    const bar=h("i"),cnt=h("div",{class:"cnt"}),stage=h("div",{class:"stage"});
    const st={n:0,ok:0,xp:0,learned:[],cur:null,quit:false};
    let i=0;
    const quit=()=>{if(st.sumRes){st.sumRes();return;}if(i>0&&!st.quit&&!confirm("Wirklich beenden? Dein Fortschritt bleibt gespeichert."))return;st.quit=true;TTS.stop();if(st.cur)st.cur({abort:true});};
    root.append(h("div",{class:"sh"},h("button",{class:"x",type:"button","aria-label":"Beenden",onclick:quit},"✕"),h("div",{class:"bar"},bar),cnt),stage);
    document.body.append(root);inSession=true;fitSess();
    (async function loop(){
      while(i<tasks.length&&!st.quit){
        const t=tasks[i],total=Math.max(tasks.length,opt.total||0);
        bar.style.width=Math.round(i/total*100)+"%";cnt.textContent=(i+1)+"/"+total;
        stage.replaceChildren();stage.scrollTop=0;root.classList.add("lock");setTimeout(()=>root.classList.remove("lock"),350);
        const r=await new Promise(res=>{st.cur=res;try{t.fn(stage,res);}catch(e){console.error(e);res({ok:true,info:true});}});
        st.cur=null;
        if(r.abort)break;
        applyRes(t,r,st);
        if(!r.ok&&t.k&&t.g&&!t.re&&!t.info&&!r.info)tasks.splice(Math.min(i+4,tasks.length),0,Object.assign({},t,{re:true,g:false}));
        if(opt.after)opt.after(t,r,tasks,st);
        i++;
      }
      bar.style.width="100%";
      if(!st.quit&&opt.summary!==false)await summary(stage,title,st,opt);
      root.remove();inSession=false;TTS.stop();adaptLevel();recLevel();touchStreak();save(true);
      resolve({done:!st.quit,st});
    })();
  });
}
function applyRes(t,r,st){
  if(t.introNew&&t.k){card(t.k);if(!st.learned.includes(t.k))st.learned.push(t.k);}
  if(r.known&&t.k){const c=card(t.k);c.b=Math.max(c.b,3);c.due=dayStart()+4*DAY;}
  if(t.seen)S.seen[t.seen]=1;
  if(t.phr){t.phr.forEach(k=>{const c=card(k);if(c.b===0){c.b=1;c.due=dayStart()+DAY;}});}
  if(t.info||r.info)return;
  const d=dayRec();d.n++;st.n++;if(r.ok){d.ok++;st.ok++;}
  const xp=r.ok?10:2;d.xp+=xp;S.xp+=xp;st.xp+=xp;
  S.acc.push(r.ok?1:0);if(S.acc.length>60)S.acc.shift();
  if(t.k){if(t.g)grade(t.k,r.ok);else if(!r.ok)card(t.k).bad++;}
  if(t.gram){const g=S.gram[t.gram]||(S.gram[t.gram]={p:0,ok:0,tot:0,done:false});g.tot++;if(r.ok)g.ok++;if(t.idx!=null){g.p=Math.max(g.p,t.idx+1);if(g.p>=t.n)g.done=true;}}
  if(t.dict){const x=S.dict[t.dict]||(S.dict[t.dict]={s:0,ok:0});x.s++;if(r.ok)x.ok++;}
}
