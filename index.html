<style>

<script>
/* ===== Kern: Hilfsfunktionen, Zustand, Daten, Sprache, Lernlogik ===== */
const LV=["","A1","A2","B1","B2","C1"];
const DAY=864e5;
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dayKey(t){const d=new Date(t||Date.now());return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayStart(t){const d=new Date(t||Date.now());d.setHours(0,0,0,0);return d.getTime();}
function cefr(L){return LV[Math.max(1,Math.min(5,Math.round(L)))];}
function cefrExact(L){return L<1.5?"A1":L<2.5?"A2":L<3.5?"B1":L<4.5?"B2":"C1";}

/* ---------- Zustand ---------- */
const KEY="englisch-v1";
let S;
function defaults(){return{v:1,created:Date.now(),placed:false,L:2,Lhist:[],cards:{},gram:{},dict:{},xp:0,streak:0,best:0,lastDay:"",days:{},today:{d:"",done:{}},
  set:{goal:30,acc:"en-US",rate:0.9,theme:"auto",showDe:true,voice:"",autoNext:true,proxyUrl:"",proxyToken:""},acc:[],media:0,pq:[],lastBackup:0,seen:{},tests:[],pron:{words:{},sounds:{}}};}
function load(){
  let o={};try{o=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){try{localStorage.setItem(KEY+"-corrupt",localStorage.getItem(KEY));}catch(x){}}
  const d=defaults();S=Object.assign(d,o);S.set=Object.assign(defaults().set,o.set||{});
  const pr=o.pron&&typeof o.pron==="object"?o.pron:{};
  S.pron={words:(pr.words&&typeof pr.words==="object")?pr.words:{},sounds:(pr.sounds&&typeof pr.sounds==="object")?pr.sounds:{}};
  if(!S.today||S.today.d!==dayKey()){S.today={d:dayKey(),done:{}};}
}
let saveT,frozen=false,saveMuteUntil=0;
function freezeSave(){frozen=true;clearTimeout(saveT);}
function save(now){if(frozen)return;clearTimeout(saveT);const f=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));const b=document.getElementById("savebanner");if(b)b.remove();}catch(e){onSaveFail();}};if(now)f();else saveT=setTimeout(f,250);}
function onSaveFail(){
  if(document.getElementById("savebanner")||Date.now()<saveMuteUntil)return;
  showSaveBanner("Speichern fehlgeschlagen: Der Speicher ist voll oder blockiert (zum Beispiel privates Fenster oder volle Browser-Daten). Dein Fortschritt bleibt so nicht erhalten. Bitte sofort ein Backup machen.");
}
function showSaveBanner(text){
  const old=document.getElementById("savebanner");if(old)old.remove();
  const el=h("div",{id:"savebanner",class:"banner",role:"alert"},
    h("div",null,text),
    h("div",{class:"two",style:{marginTop:"10px"}},
      h("button",{class:"btn small primary",type:"button",onclick:()=>{el.remove();tab="more";render();page("Backup",backupView());}},"Backup öffnen"),
      h("button",{class:"btn small",type:"button",onclick:()=>{saveMuteUntil=Date.now()+15000;el.remove();}},"Schließen")));
  document.body.append(el);
}
function dayRec(k){k=k||dayKey();return S.days[k]||(S.days[k]={sec:0,xp:0,n:0,ok:0});}
function streakNow(){const t=dayKey(),y=dayKey(Date.now()-DAY);return(S.lastDay===t||S.lastDay===y)?S.streak:0;}
function touchStreak(){
  const k=dayKey();if(S.lastDay===k)return;
  if(dayRec(k).sec>=300){S.streak=(S.lastDay===dayKey(Date.now()-DAY))?S.streak+1:1;S.lastDay=k;S.best=Math.max(S.best,S.streak);}
}

/* ---------- Lerninhalte (JSON, vom Service Worker auch offline) ---------- */
let D={vocab:[],chunks:[],sentences:[],dialogues:[],grammar:[],placement:[],listening:{reductions:[]},dict:[],songs:[]};
const DATA_FILES=[["vocab","data/vocab.json"],["chunks","data/chunks.json"],["sentences","data/sentences.json"],["dialogues","data/dialogues.json"],["grammar","data/grammar.json"],["songs","data/songs.json"],["placement","data/placement.json"],["listening","data/listening.json"]];
let contentReady=false,bootError="";
async function loadContent(){
  const parts=await Promise.all(DATA_FILES.map(async([k,url])=>{
    const res=await fetch(url);
    if(!res.ok)throw new Error(url+" "+res.status);
    return [k,await res.json()];
  }));
  const next={vocab:[],chunks:[],sentences:[],dialogues:[],grammar:[],placement:[],listening:{reductions:[]},dict:[],songs:[]};
  for(const [k,json] of parts){
    if(k==="listening"){
      if(!json||!Array.isArray(json.reductions)||!Array.isArray(json.dict))throw new Error("listening");
      next.listening={reductions:json.reductions};next.dict=json.dict;
    }else{
      if(!Array.isArray(json))throw new Error(k);
      next[k]=json;
    }
  }
  D=next;
}
const ITEMS={},POOL={v:[],c:[],r:[],s:[],p:[]};
function addItem(t,o){
  if(!o||!o.en||!o.de)return;
  o.lvl=Math.max(1,Math.min(5,(o.lvl|0)||2));
  const k=t+":"+o.en;if(ITEMS[k])return;
  o.t=t;o.k=k;ITEMS[k]=o;POOL[t].push(o);
}
function buildItems(){
  const A=x=>Array.isArray(x)?x:[];
  A(D.vocab).forEach(x=>addItem("v",x));
  A(D.chunks).forEach(x=>addItem("c",x));
  const L=D.listening||{};
  A(L.reductions).forEach(x=>addItem("r",{en:x.spoken,full:x.full,de:x.full+(x.de?"  ·  "+x.de:""),ex:x.ex,exde:x.exde,say:x.say,lvl:x.lvl||2,cat:"alltag"}));
  A(D.sentences).forEach(x=>addItem("s",x));
  A(D.dialogues).forEach(d=>A(d.phrases).forEach(p=>addItem("p",{en:p.en,de:p.de,note:p.note,lvl:d.lvl,cat:"alltag"})));
}

/* ---------- Text-Vergleich ---------- */
const CONTR={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","i'd":"i would","you'd":"you would","he'd":"he would","she'd":"she would","we'd":"we would","they'd":"they would","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","wouldn't":"would not","shouldn't":"should not","couldn't":"could not","haven't":"have not","hasn't":"has not","hadn't":"had not","mustn't":"must not","let's":"let us","that's":"that is","there's":"there is","what's":"what is","where's":"where is","who's":"who is","here's":"here is"};
(function(){const skip={its:1,were:1,ill:1,id:1,hell:1,shell:1,well:1,wed:1,wont:1,lets:1,shed:1,hed:1};

function norm(s){

    shuffle(grp).forEach(it=>q.push({fn:X.mc(it,"e2d"),k:it.k,g:false}));

}

  if(!pool.length){S.placed=true;save(true);render();return;}
  let used=new Set(retest?S.pq:[]);
  if(pool.filter(q=>!used.has(q.id)).length<25)used=new Set();
  const by={1:[],2:[],3:[],4:[],5:[]};shuffle(pool).forEach(q=>{if(!used.has(q.id)&&by[q.lvl])by[q.lvl].push(q);});
  let lvl=2,N=20,res=[];
  const nextQ=()=>{for(const d of [0,1,-1,2,-2,3,-3]){const l=lvl+d;if(by[l]&&by[l].length){const q=by[l].shift();S.pq.push(q.id);return q;}}return null;};
  const mk=q=>({info:true,q,fn:(stage,done)=>mcCore(stage,done,{label:"Frage "+(res.length+1)+" von "+N,head:[q.text?h("div",{class:"card"},q.text):null,h("div",{class:"q"},gapNode(q.q))],opts:q.opts,ans:q.a,blind:true,dk:true})});

    res.push({lvl:t.q.lvl,ok:!!r.ok});lvl=Math.max(1,Math.min(5,lvl+(r.ok?1:-1)));

  }});
  if(res.length<8){render();return;}
  const last=res.slice(-12);let L=last.reduce((a,x)=>a+x.lvl+(x.ok?.5:-.5),0)/last.length;L=Math.max(1,Math.min(5,Math.round(L*10)/10));
  const first=!S.placed;S.L=first?L:Math.round((S.L+L)/2*10)/10;S.placed=true;S.tests.push({d:dayKey(),L});recLevel();save(true);
  sheet(h("div",null,h("h1",null,"Dein Niveau: "+cefrExact(L)),h("p",{class:"muted"},res.filter(x=>x.ok).length+" von "+res.length+" richtig"),
    h("p",null,L<2?"Wir starten bei den Grundlagen und festigen sie schnell.":L<3?"Du hast eine solide Basis. Wir bauen Wortschatz und Sicherheit im Sprechen aus.":L<4?"Gute Grundlage! Jetzt geht es um Tempo, Nuancen und Hörverstehen.":"Starkes Niveau. Fokus auf Feinschliff, Idiome und Filmsprache."),

    h("button",{class:"btn primary",type:"button",onclick:()=>{closeSheet();render();}},"Los geht’s")));

function proxyBase(){
  let u=(S.set.proxyUrl||"").trim();
  if(!u)return "";
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  return u.replace(/\/+$/,"");
}
function offlineChatNote(){return "Für das freie Gespräch brauchst du Internet. Ohne Netz übst du mit festen Sätzen: anhören, nachsprechen oder tippen.";}
function aiErrorText(code){
  const m=String(code||"");
  if(m==="no-proxy")return "Noch kein Proxy eingetragen.";
  if(m==="http-401")return "Zugriff verweigert. Prüfe das Token in den Einstellungen.";
  if(m==="http-404")return "Proxy-Adresse nicht gefunden. Sie sollte so aussehen: https://name.workers.dev";
  if(m==="http-429")return "Zu viele Anfragen. Warte eine Minute und versuche es nochmal.";
  if(m==="http-400")return "Diese Szene kennt der Proxy nicht. Ist der Worker auf dem neuesten Stand?";
  if(m==="timeout")return "Der Proxy antwortet nicht. Prüfe die Internetverbindung.";
  if(m==="empty")return "Der Proxy hat eine leere Antwort geschickt. Prüfe Modell und Schlüssel.";
  if(m.indexOf("http-")===0)return "Der Proxy hat einen Fehler gemeldet. Prüfe den API-Schlüssel und die Anleitung im Ordner proxy.";
  return "Keine Verbindung zum Proxy. Stimmt die Adresse, und bist du online?";
}
async function aiTurn(scenarioId,history){
  if(!netOn())throw new Error("offline");
  const base=proxyBase();
  if(!base)throw new Error("no-proxy");
  const headers={"Content-Type":"application/json"};
  const token=(S.set.proxyToken||"").trim();
  if(token)headers.Authorization="Bearer "+token;
  const ctrl=new AbortController();
  const tm=setTimeout(()=>ctrl.abort(),25000);
  try{
    const res=await fetch(base+"/chat",{method:"POST",headers,signal:ctrl.signal,body:JSON.stringify({scenario:scenarioId,level:cefrExact(S.L),history:(history||[]).slice(-12).map(m=>({role:m.role,content:String(m.content||"").slice(0,800)}))})});
    if(!res.ok)throw new Error("http-"+res.status);
    const data=await res.json();
    if(!data||!data.reply)throw new Error("empty");
    return data;
  }catch(e){
    if(e&&e.name==="AbortError")throw new Error("timeout");
    if(e&&/^(http-|empty|no-proxy|timeout)$/.test(String(e.message||"")))throw e;
    throw new Error("network");
  }finally{clearTimeout(tm);}
}

    render();
  }
}
