<style>
:root{
  --bg:#f3f6f5;--surface:#fff;--surface2:#e5ecea;--fg:#10211f;--muted:#4f6663;--line:#cfdad7;
  --accent:#0f766e;--accent2:#0d5f59;--accent-fg:#fff;--ok:#15803d;--okbg:#dcf3e3;--bad:#b91c1c;--badbg:#fde4e4;--warn:#b45309;--warnbg:#fdf0d5;--gold:#d97706;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1615;--surface:#152422;--surface2:#1d312e;--fg:#e6f2ef;--muted:#9bb8b3;--line:#2a423e;
  --accent:#2dd4bf;--accent2:#5eead4;--accent-fg:#06211e;--ok:#4ade80;--okbg:#14351f;--bad:#f87171;--badbg:#3b1b1f;--warn:#fbbf24;--warnbg:#3a2d12;--gold:#fbbf24;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0c1615;--surface:#152422;--surface2:#1d312e;--fg:#e6f2ef;--muted:#9bb8b3;--line:#2a423e;
  --accent:#2dd4bf;--accent2:#5eead4;--accent-fg:#06211e;--ok:#4ade80;--okbg:#14351f;--bad:#f87171;--badbg:#3b1b1f;--warn:#fbbf24;--warnbg:#3a2d12;--gold:#fbbf24;color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(92px + env(safe-area-inset-bottom,0px))}
h1{font-size:28px;margin:0 0 4px;line-height:1.1}
h2{font-size:20px;margin:22px 0 8px}
h3{font-size:17px;margin:0 0 4px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:99px;padding:3px 11px;font-size:14px;font-weight:600}
.chip.acc{background:var(--accent);color:var(--accent-fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.warn{background:var(--warnbg);border-color:var(--warn)}
.btn{display:block;width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;padding:10px 16px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;font-size:15px}
.btn:disabled{opacity:.45}
.btn+.btn{margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn+.btn{margin-top:0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs button{border:0;background:transparent;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.tabs button span{font-size:22px;line-height:1}
.tabs button[aria-selected="true"]{color:var(--accent)}
.blk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:64px}
.blk .ic{font-size:26px;width:36px;text-align:center}
.blk .t{font-weight:700}
.blk .s{font-size:14px;color:var(--muted)}
.blk.done{background:var(--okbg);border-color:var(--ok)}
.blk .ck{font-size:22px;color:var(--ok)}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1}
.ring .n small{font-size:12px;font-weight:600;color:var(--muted)}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.list button.it{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;min-height:54px}
.list .it .grow{flex:1;min-width:0}
.list .it .a{font-weight:700}
.list .it .b{font-size:14px;color:var(--muted)}
input[type=text],input[type=search],textarea,select{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;font-size:18px}
textarea{min-height:120px;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{flex:1;min-width:64px;min-height:44px;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
label.fl{display:block;font-weight:700;margin:14px 0 6px}
#sess{position:fixed;inset:0;height:100dvh;background:var(--bg);z-index:50;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
@media(min-width:561px){#sess{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.sh{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px}
.sh .x{border:0;background:transparent;font-size:26px;min-width:44px;min-height:44px;color:var(--muted)}
.sh .bar{flex:1}
.sh .cnt{font-size:14px;font-weight:700;color:var(--muted);min-width:44px;text-align:right}
.stage{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 18px 18px;display:flex;flex-direction:column}
.stage>.grow{flex:1}
.ql{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:6px 0 10px}
.big{font-size:32px;font-weight:800;line-height:1.15;margin:4px 0 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.q{font-size:22px;font-weight:700;line-height:1.3;margin:4px 0 14px}
.q .gap{display:inline-block;min-width:64px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.de{color:var(--muted);font-size:18px}
.exs{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.exs .en{font-size:19px;font-weight:600;margin-bottom:4px}
mark{background:transparent;color:var(--accent);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.spk{border:0;background:var(--surface2);border-radius:50%;width:48px;height:48px;font-size:22px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.spk.slow{font-size:15px;font-weight:800}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{min-height:56px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-size:18px;font-weight:600}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.sel{border-color:var(--accent);background:var(--surface2)}
.foot{position:sticky;bottom:0;margin:12px -18px -18px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.foot.good{background:var(--okbg);border-color:var(--ok)}
.foot.bad{background:var(--badbg);border-color:var(--bad)}
.fbt{font-weight:800;font-size:19px;margin-bottom:4px}
.foot.good .fbt{color:var(--ok)}.foot.bad .fbt{color:var(--bad)}
.fbd{font-size:16px;margin-bottom:10px}
.diff{font-size:18px;line-height:1.5}.diff.you{color:var(--muted)}
.diff .miss{color:var(--ok);font-weight:800;text-decoration:underline}
.diff .wrong{color:var(--bad);text-decoration:line-through}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px 0}
.ans{border-bottom:2px solid var(--line);border-top:2px solid var(--line);min-height:70px;margin:10px 0}
.tile{min-height:46px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;font-size:18px;font-weight:600}
.tile.used{opacity:.25;pointer-events:none}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;margin:8px 0;background:var(--surface);border:1px solid var(--line)}
.bub.b{margin-left:auto;background:var(--surface2)}
.bub.play{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.bub .en{font-weight:600}
.bub .de{font-size:15px;margin-top:2px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:34px;margin:10px auto;display:block}
.mic.rec{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.sum{text-align:center;padding-top:30px}
.sum .em{font-size:64px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px;margin:8px 0 4px}
.chart div{flex:1;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px;opacity:.9}
.chart div.t{background:var(--gold)}
.lbls{display:flex;gap:6px;font-size:12px;color:var(--muted)}.lbls span{flex:1;text-align:center}
.wk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wk .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800}
.wk.cur .n{background:var(--accent);color:var(--accent-fg)}.wk.past .n{background:var(--ok);color:#fff}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:70;font-weight:600;max-width:90%}
.tip{white-space:pre-line;font-size:17px;line-height:1.5}

#sess.lock .stage{pointer-events:none}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.opt:active,.btn:active,.tile:active,.blk:active{transform:scale(.98);filter:brightness(.95)}
.stage{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}

":"sich ranhalten, konzentrieren","ex":"I need to buckle down and study.","exde":"Ich muss mich jetzt hinsetzen und lernen.","lvl":5,"type":"phrasal"},{"en":"to chip in","de":"zusammenlegen, beisteuern","ex":"We all chipped in for her gift.","exde":"Wir haben alle für ihr Geschenk zusammengelegt.","lvl":5,"type":"phrasal"},{"en":"to clam up","de":"verstummen, dichtmachen","ex":"He clammed up when I asked about it.","exde":"Er hat dichtgemacht, als ich danach fragte.","lvl":5,"type":"phrasal"},{"en":"to come down with","de":"erkranken an","ex":"I think I'm coming down with something.","exde":"Ich glaube, ich werde krank.","lvl":5,"type":"phrasal"},{"en":"to drag on","de":"sich hinziehen","ex":"The meeting dragged on for hours.","exde":"Das Meeting zog sich über Stunden hin.","lvl":5,"type":"phrasal"},{"en":"to fall through","de":"ins Wasser fallen, platzen","ex":"Our plans fell through at the last minute.","exde":"Unsere Pläne sind in letzter Minute geplatzt.","lvl":5,"type":"phrasal"},{"en":"to fizzle out","de":"im Sand verlaufen","ex":"The excitement slowly fizzled out.","exde":"Die Begeisterung ist langsam verpufft.","lvl":5,"type":"phrasal"},{"en":"to get around to","de":"dazu kommen","ex":"I never got around to calling her.","exde":"Ich bin nie dazu gekommen, sie anzurufen.","lvl":5,"type":"phrasal"},{"en":"to iron out","de":"ausbügeln, klären","ex":"We still need to iron out a few details.","exde":"Wir müssen noch ein paar Details klären.","lvl":5,"type":"phrasal"},{"en":"to live up to","de":"gerecht werden","ex":"The movie didn't live up to the hype.","exde":"Der Film wurde dem Hype nicht gerecht.","lvl":5,"type":"phrasal"},{"en":"to own up to","de":"zugeben, gestehen","ex":"He finally owned up to his mistake.","exde":"Er hat seinen Fehler endlich zugegeben.","lvl":5,"type":"phrasal"},{"en":"to pan out","de":"sich entwickeln, klappen","ex":"Let's see how things pan out.","exde":"Mal sehen, wie sich das entwickelt.","lvl":5,"type":"phrasal"},{"en":"to play down ":3,"type":"idiom"},{"en":"to cost an arm and a leg","de":"ein Vermögen kosten","ex":"This phone cost an arm and a leg.","exde":"Dieses Handy hat ein Vermögen gekostet.","lvl":3,"type":"idiom"},{"en":"to bite the bullet","de":"in den sauren Apfel beißen","ex":"I just have to bite the bullet and pay.","exde":"Ich muss einfach in den sauren Apfel beißen und zahlen.","lvl":3,"type":"idiom"},{"en":"to hit the sack","de":"sich aufs Ohr hauen","ex":"I'm exhausted, I'm gonna hit the sack.","exde":"Ich bin fertig, ich hau mich aufs Ohr.","lvl":3,"type":"idiom","note":"Umgangssprachlich für \"ins Bett gehen\"."},{"en":"in the long run","de":"auf lange Sicht","ex":"It's cheaper in the long run.","exde":"Auf lange Sicht ist es billiger.","lvl":3,"type":"idiom"},{"en":"to be on the same page","de":"einer Meinung sein","ex":"Let's make sure we're on the same page.","exde":"Lass uns sichergehen, dass wir uns einig sind.","lvl":3,"type":"idiom","note":"Sehr häufig im Job."},{"en":"the last straw","de":"der Tropfen, der das Fass zum Überlaufen bringt","ex":"Being late again was the last straw.","exde":"Schon wieder zu spät zu sein, war der letzte Tropfen.","lvl":3,"type":"idiom"},{"en":"speak of the devil","de":"wenn man vom Teufel spricht","ex":"Speak of the devil, here she comes!","exde":"Wenn man vom Teufel spricht, da kommt sie!","lvl":3,"type":"idiom"},{"en":"you can say that again","de":"das kannst du laut sagen","ex":"\"It's freezing.\" \"You can say that again!\"","exde":"\"Es ist eiskalt.\" \"Das kannst du laut sagen!\"","lvl":3,"type":"idiom"},{"en":"to beat around the bush","de":"um den heißen Brei herumreden","ex":"Stop beating around the bush and tell me.","exde":"Hör auf, um den heißen Brei zu reden, und sag es mir.","lvl":3,"type":"idiom"},{"en":"to cut corners","de":"an der falschen Stelle sparen","ex":"They cut corners and the house fell apart.","exde":"Sie haben gespart, und das Haus fiel auseinander.","lvl":3,"type":"idiom"},{"en":"to get cold feet","de":"kalte F n den Zeilen liest, ist er sauer.","lvl":4,"type":"idiom"},{"en":"to see eye to eye","de":"einer Meinung sein","ex":"We don't always see eye to eye.","exde":"Wir sind nicht immer einer Meinung.","lvl":4,"type":"idiom"},{"en":"the elephant in the room","de":"das heikle Thema, das keiner anspricht","ex":"Money is the elephant in the room.","exde":"Geld ist das heikle Thema, das keiner anspricht.","lvl":4,"type":"idiom"},{"en":"to throw in the towel","de":"das Handtuch werfen","ex":"After three tries, I threw in the towel.","exde":"Nach drei Versuchen habe ich das Handtuch geworfen.","lvl":4,"type":"idiom"},{"en":"to add insult to injury","de":"das Ganze noch schlimmer machen","ex":"He forgot my birthday, and to add insult to injury, he laughed.","exde":"Er hat meinen Geburtstag vergessen und, schlimmer noch, gelacht.","lvl":4,"type":"idiom"},{"en":"to walk on eggshells","de":"vorsichtig auftreten","ex":"I'm walking on eggshells around her lately.","exde":"Ich muss in letzter Zeit bei ihr sehr vorsichtig sein.","lvl":4,"type":"idiom"},{"en":"to wrap your head around","de":"etwas begreifen","ex":"I can't wrap my head around this rule.","exde":"Ich kann diese Regel einfach nicht begreifen.","lvl":4,"type":"idiom","note":"Sehr häufig bei schwer zu verstehenden Dingen."},{"en":"under the radar","de":"unbemerkt","ex":"He kept his plans under the radar.","exde":"Er hielt seine Pläne unter dem Radar.","lvl":4,"type":"idiom"},{"en":"at the end of my rope","de":"am Ende meiner Kräfte","ex":"I'm at the end of my rope with this project.","exde":"Ich bin mit diesem Projekt am Ende meiner Kräfte.","lvl":4,"type":"idiom","note":"Britisch: \"at the end of my tether\"."},{"en":"to call the shots","de":"das Sagen haben","ex":"Who calls the shots around here?","exde":"Wer hat hier das Sagen?","lvl":4,"type":"idiom"},{"en":"to cut to the chase","de":"zum Punkt kommen","ex":"Let's cut to the chase. What do you want?","exde":"Kommen wir zum Punkt. Was willst du?","lvl":4,"type":"idiom"},{"en":"to drive someone up the wall","de":"jemanden wahnsinnig machen","ex":"This noise is driving me up the wall.","exde":"Dieser Lärm macht mich wahnsinnig.","lvl":4,"type":"idiom"},{"en":"to get the hang of","de":"den Dreh raushaben","ex":"I'm finally getting the hang of this game.","exde":"Ich habe den Dreh bei diesem Spiel endlich raus.","lvl":4,"type":"idiom"},{"en":"the tip of the iceberg","de":"die Spitze des Eisbergs","ex":"These problems are just the tip of the iceberg.","exde":"Diese Probleme sind nur die Spitze des Eisbergs.","lvl":4,"type":"idiom"},{"en":"to steal the show","de":"allen die Show stehlen","ex":"The little kid stole the show.","exde":"Der kleine Junge hat allen die Show gestohlen.","lvl":4,"type":"idiom"},{"en":"the whole nine yards","de":"das volle Programm","ex":"They gave us the whole nine yards: dinner, drinks, music.","exde":"Wir bekamen das volle Programm: Essen, Drinks, Musik.","lvl":5,"type":"idiom"},{"en":"a hard pill to swallow","de":"eine bittere Pille","ex":"Losing the final was a hard pill to swallow.","exde":"Das Finale zu verlieren war eine bittere Pille.","lvl":5,"type":"idiom"},{"en":"to bite off more than you can chew","de":"sich zu viel zumuten","ex":"I think I bit off more than I could chew.","exde":"Ich glaube, ich habe mir zu viel zugemutet.","lvl":5,"type":"idiom"},{"en":"by the skin of your teeth","de":"mit knapper Not","ex":"We passed the exam by the skin of our teeth.","exde":"Wir haben die Prüfung mit knapper Not bestanden.","lvl":5,"type":"idiom"},{"en":"a wild goose chase","de":"eine sinnlose Suche","ex":"The whole search was a wild goose chase.","exde":"Die ganze Suche war reine Zeitverschwendung.","lvl":5,"type":"idiom"},{"en":"to throw someone under the bus","de":"jemanden ans Messer liefern","ex":"He threw me under the bus to save himself.","exde":"Er hat mich verraten, um sich zu retten.","lvl":5,"type":"idiom"},{"en":"the writing is on the wall","de":"das Ende ist absehbar","ex":"The writing's on the wall for that company.","exde":"Für die Firma ist das Ende absehbar.","lvl":5,"type":"idiom"},{"en":"to bark up the wrong tree","de":"auf dem Holzweg sein","ex":"If you think I did it, you're barking up the wrong tree.","exde":"Wenn du denkst, ich war es, bist du auf dem Holzweg.","lvl":5,"type":"idiom"},{"en":"to pass the buck","de":"die Verantwortung abschieben","ex":"Stop passing the buck and fix it.","exde":"Hör auf, die Verantwortung abzuschieben, und reparier es.","lvl":5,"type":"idiom"},{"en":"the tables have turned","de":"das Blatt hat sich gewendet","ex":"Now the tables have turned, and he needs my help.","exde":"Jetzt hat sich das Blatt gewendet, und er braucht meine Hilfe.","lvl":5,"type":"idiom"},{"en":"on the back burner","de":"auf Eis gelegt","ex":"The project has been on the back burner for months.","exde":"Das Projekt liegt seit Monaten auf Eis.","lvl":5,"type":"idiom"},{"en":"cross that bridge when we come to it","de":"das sehen wir, wenn es soweit ist","ex":"What if it rains? We'll cross that bridge when we come to it.","exde":"Und wenn es regnet? Das sehen wir, wenn es soweit ist.","lvl":5,"type":"idiom"},{"en":"tongue in cheek","de":"augenzwinkernd, ironisch","ex":"I said it tongue in cheek, don't take it seriously.","exde":"Ich habe das ironisch gemeint, nimm es nicht ernst.","lvl":5,"type":"idiom"},{"en":"to face the music","de":"die Konsequenzen tragen","ex":"You broke it, so now you face the music.","exde":"Du hast es kaputt gemacht, jetzt trag die Konsequenzen.","lvl":5,"type":"idiom"},{"en":"to stir the pot","de":"Streit anfachen","ex":"He loves stirring the pot at family dinners.","exde":"Er liebt es, bei Familienessen Streit anzuzetteln.","lvl":5,"type":"idiom"},{"en":"dude","de":"Alter, Mann","ex":"Dude, you have to see this!","exde":"Alter, das musst du sehen!","lvl":2,"type":"slang","note":"Amerikanisch, unter Freunden, auch für Frauen unter Freundinnen möglich."},{"en":"awesome","de":"geil, großartig","ex":"That concert was awesome!","exde" ive far away.","de":"Ich wünschte, ich könnte mehr Zeit mit meinen Großeltern verbringen, aber sie wohnen weit weg.","lvl":4,"cat":"menschen"},{"en":"She's been through a lot lately, so try to be patient with her.","de":"Sie hat in letzter Zeit viel durchgemacht, also hab Geduld mit ihr.","lvl":4,"cat":"menschen"},{"en":"The woman who lives upstairs is a nurse, and she works night shifts.","de":"Die Frau, die oben wohnt, ist Krankenschwester und arbeitet Nachtschichten.","lvl":4,"cat":"menschen"},{"en":"I used to be really shy, but I've gotten much better at talking to strangers.","de":"Früher war ich sehr schüchtern, aber ich kann inzwischen viel besser mit Fremden reden.","lvl":4,"cat":"menschen"},{"en":"It's hard to trust someone who has lied to you more than once.","de":"Es ist schwer, jemandem zu vertrauen, der dich mehr als einmal belogen hat.","lvl":4,"cat":"menschen"},{"en":"If the weather had been better, we would have spent more time at the beach.","de":"Wenn das Wetter besser gewesen wäre, hätten wir mehr Zeit am Strand verbracht.","lvl":4,"cat":"reisen"},{"en":"Our luggage was lost, so we had to buy new clothes at the airport.","de":"Unser Gepäck ging verloren, also mussten wir am Flughafen neue Kleidung kaufen.","lvl":4,"cat":"reisen"},{"en":"I'd recommend booking the tickets in advance, as they tend to sell out quickly.","de":"Ich würde empfehlen, die Tickets im Voraus zu buchen, da sie schnell ausverkauft sind.","lvl":4,"cat":"reisen"},{"en":"The hotel, which was recommended by a friend, turned out to be fantastic.","de":"Das Hotel, das ein Freund empfohlen hatte, war am Ende fantastisch.","lvl":4,"cat":"reisen"},{"en":"We've decided to spend a week in Italy instead of going to Greece this year.","de":"Wir haben beschlossen, dieses Jahr eine Woche in Italien zu verbringen statt nach Griechenland zu fahren.","lvl":4,"cat":"reisen"},{"en":"You need to have your passport checked before you can board the plane.","de":"Du musst deinen Reisepass kontrollieren lassen, bevor du in das Flugzeug steigen kannst.","lvl":4,"cat":"reisen"},{"en":"I'm not sure if I'll be able to make it, but I'll let you know tomorrow.","de":"Ich weiß nicht, ob ich es schaffe, aber ich sage dir morgen Bescheid.","lvl":4,"cat":"reisen"},{"en":"It was such a long trip that we were exhausted by the time we arrived.","de":"Es war so eine lange Reise, dass wir bei der Ankunft erschöpft waren.","lvl":4,"cat":"reisen"},{"en":"I would have ordered the soup if I had known how big the portions were.","de":"Ich hätte die Suppe bestellt, wenn ich gewusst hätte, wie groß die Portionen sind.","lvl":4,"cat":"essen"},{"en":"The restaurant we went to last night was packed, but the service was great.","de":"Das Restaurant, in dem wir gestern Abend waren, war voll, aber der Service war toll.","lvl":4,"cat":"essen"},{"en":"Could you tell the chef that the meat is a little overcooked?","de":"Könnten Sie dem Koch sagen, dass das Fleisch etwas zu lange gebraten ist?","lvl":4,"cat":"essen"},{"en":"I've stopped eating meat, but I still can't resist a good cheeseburger.","de":"Ich esse kein Fleisch mehr, aber einem guten Cheeseburger kann ich trotzdem nicht widerstehen.","lvl":4,"cat":"essen"},{"en":"The dinner was supposed to be ready by seven, but we're still waiting.","de":"Das Abendessen sollte um sieben fertig sein, aber wir warten immer noch.","lvl":4,"cat":"essen"},{"en":"If you add a little more salt, the sauce will taste much better.","de":"Wenn du etwas mehr Salz hinzufügst, schmeckt die Soße viel besser.","lvl":4,"cat":"essen"},{"en":"I wish I had told her how I felt before it was too late.","de":"Ich wünschte, ich hätte ihr gesagt, was ich fühle, bevor es zu spät war.","lvl":4,"cat":"gefuehle"},{"en":"It's been a long time since I felt this relaxed and happy.","de":"Es ist lange her, dass ich mich so entspannt und glücklich gefühlt habe.","lvl":4,"cat":"gefuehle"},{"en":"Although I was exhausted, I couldn't fall asleep because I kept overthinking.","de":"Obwohl ich erschöpft war, konnte ich nicht einschlafen, weil ich ständig gegrübelt habe.","lvl":4,"cat":"gefuehle"},{"en":"I'm afraid I've made a huge mistake, and I don't know how to fix it.","de":"Ich fürchte, ich habe einen riesigen Fehler gemacht und weiß nicht, wie ich ihn beheben soll.","lvl":4,"cat":"gefuehle"},{"en":"She was so relieved that she burst into tears when she heard the news.","de":"Sie war so erleichtert, dass sie bei der Nachricht in Tränen ausbrach.","lvl":4,"cat":"gefuehle"},{"en":"There's nothing I enjoy more than a quiet evening with good friends.","de":"Nichts genieße ich mehr als einen ruhigen Abend mit guten Freunden.","lvl":4,"cat":"gefuehle"},{"en":"I've been feeling dizzy lately, so I'm going to get it checked out.","de":"Mir ist in letzter Zeit schwindelig, deshalb lasse ich das untersuchen.","lvl":4,"cat":"gesundheit"},{"en":"If you want to stay healthy, you should get at least seven hours of sleep.","de":"Wenn du gesund bleiben willst, solltest du mindestens sieben Stunden schlafen.","lvl":4,"cat":"gesundheit"},{"en":"He was told to avoid heavy lifting for at least six weeks.","de":"Ihm wurde gesagt, er solle mindestens sechs Wochen lang nichts Schweres heben.","lvl":4,"cat":"gesundheit"},{"en":"The film, which was shot entirely in Iceland, has received great reviews.","de":"Der Film, der komplett in Island gedreht wurde, hat tolle Kritiken bekommen.","lvl":4,"cat":"medien"},{"en":"I can't stand it when people spoil the ending before I've finished watching.","de":"Ich hasse es, wenn Leute das Ende verraten, bevor ich fertig geschaut habe.","lvl":4,"cat":"medien"},{"en":"This song was written by a young singer who had never performed live before.","de":"Dieses Lied wurde von einer jungen Sängerin geschrieben, die noch nie live aufgetreten war.","lvl":4,"cat":"medien"},{"en":"The software has to be updated regularly in order to stay secure.","de":"Die Software muss regelmäßig aktualisiert werden, um sicher zu bleiben.","lvl":4,"cat":"technik"},{"en":"I accidentally deleted the file, and now I can't find it anywhere.","de":"Ich habe die Datei aus Versehen gelöscht und finde sie jetzt nirgends.","lvl":4,"cat":"technik"},{"en":"If the problem persists, you might want to contact customer support.","de":"Falls das Problem weiterhin besteht, solltest du dich an den Kundendienst wenden.","lvl":4,"cat":"technik"},{"en":"I'd like a refund, as the product doesn't work the way it was advertised.","de":"Ich hätte gern eine Rückerstattung, da das Produkt nicht so funktioniert wie beworben.","lvl":4,"cat":"einkaufen"},{"en":"The jacket I ordered online arrived two weeks late and in the wrong color.","de":"Die Jacke, die ich online bestellt habe, kam zwei Wochen zu spät und in der falschen Farbe.","lvl":4,"cat":"einkaufen"},{"en":"Since it's on sale, I might as well buy two of them.","de":"Da es im Angebot ist, kann ich genauso gut zwei davon kaufen.","lvl":4,"cat":"einkaufen"},{"en":"We might go camping next weekend if the forecast looks good.","de":"Wir fahren vielleicht nächstes Wochenende zelten, wenn die Vorhersage gut aussieht.","lvl":4,"cat":"freizeit"},{"en":"I've been trying to find the time to start painting again for ages.","de":"Ich versuche schon ewig, die Zeit zu finden, wieder mit dem Malen anzufangen.","lvl":4,"cat":"freizeit"},{"en":"Having played tennis for years, he is far better than I am.","de":"Da er seit Jahren Tennis spielt, ist er viel besser als ich.","lvl":4,"cat":"freizeit"},{"en":"We'd better leave now, otherwise we'll be stuck in traffic for hours.","de":"Wir gehen besser jetzt los, sonst stecken wir stundenlang im Stau.","lvl":4,"cat":"zeit"},{"en":"By the time you read this, I'll probably be on the plane already.","de":"Wenn du das liest, sitze ich wahrscheinlich schon im Flugzeug.","lvl":4,"cat":"zeit"},{"en":"Had I known how demanding the job would be, I might have thought twice.","de":"Hätte ich gewusst, wie anspruchsvoll der Job ist, hätte ich es mir vielleicht zweimal überlegt.","lvl":5,"cat":"arbeit"},{"en":"We need to make sure that all stakeholders are kept in the loop throughout the process.","de":"Wir müssen sicherstellen, dass alle Beteiligten während des gesamten Prozesses auf dem Laufenden gehalten werden.","lvl":5,"cat":"arbeit"},{"en":"I'd appreciate it if we could touch base before the quarterly review next week.","de":"Ich würde mich freuen, wenn wir uns vor der Quartalsbesprechung nächste Woche kurz abstimmen könnten.","lvl":5,"cat":"arbeit"},{"en":"Despite the tight budget, the team managed to deliver the project ahead of schedule.","de":"Trotz des knappen Budgets hat das Team das Projekt vor dem Termin abgeliefert.","lvl":5,"cat":"arbeit"},{"en":"It goes without saying that we'll need your full commitment if this is to succeed.","de":"Es versteht sich von selbst, dass wir deinen vollen Einsatz brauchen, wenn das gelingen soll.","lvl":5,"cat":"arbeit"},{"en":"She was asked to step down after the company had been accused of misconduct.","de":"Sie wurde gebeten zurückzutreten, nachdem man dem Unternehmen Fehlverhalten vorgeworfen hatte.","lvl":5,"cat":"arbeit"},{"en":"I'm not in a position to make that decision without consulting my superiors first.","de":"Ich bin nicht in der Lage, diese Entscheidung zu treffen, ohne zuerst meine Vorgesetzten zu konsultieren.","lvl":5,"cat":"arbeit"},{"en":"Rather than complaining about the workload, we should come up with a realistic plan.","de":"Statt uns über die Arbeitsmenge zu beschweren, sollten wir einen realistischen Plan entwickeln.","lvl":5,"cat":"arbeit"},{"en":"The proposal was turned down on the grounds that it was too risky.","de":"Der Vorschlag wurde mit der Begründung abgelehnt, er sei zu riskant.","lvl":5,"cat":"arbeit"},{"en":"If it weren't for your help, I would never have finished this on time.","de":"Ohne deine Hilfe hätte ich das nie rechtzeitig fertiggestellt.","lvl":5,"cat":"arbeit"},{"en":"I couldn't care less about what other people think of my choices.","de":"Es ist mir völlig egal, was andere Leute über meine Entscheidungen denken.","lvl":5,"cat":"alltag"},{"en":"It never occurred to me that he might be struggling with something.","de":"Mir ist nie in den Sinn gekommen, dass er mit etwas zu kämpfen haben könnte.","lvl":5,"cat":"alltag"},{"en":"Not only did she forget the tickets, but she also lost her phone on the way.","de":"Sie hat nicht nur die Tickets vergessen, sondern auch unterwegs ihr Handy verloren.","lvl":5,"cat":"alltag"},{"en":"I'd like to apologize for any inconvenience this may have caused you.","de":"Ich möchte mich für etwaige Unannehmlichkeiten entschuldigen, die Ihnen dadurch entstanden sind.","lvl":5,"cat":"alltag"},{"en":"Hardly anyone realized that the meeting had been moved to another room.","de":"Kaum jemand hat bemerkt, dass das Meeting in einen anderen Raum verlegt worden war.","lvl":5,"cat":"alltag"},{"en":"It turned out that the problem was much simpler than we had originally thought.","de":"Es stellte sich heraus, dass das Problem viel einfacher war, als wir ursprünglich gedacht hatten.","lvl":5,"cat":"alltag"},{"en":"You can't just expect things to change if you're not willing to put in the effort.","de":"Du kannst nicht einfach erwarten, dass sich etwas ändert, wenn du dich nicht anstrengen willst.","lvl":5,"cat":"alltag"},{"en":"I tend to procrastinate, especially when I'm facing a task I really don't enjoy.","de":"Ich neige zum Aufschieben, besonders wenn eine Aufgabe ansteht, die mir überhaupt keinen Spaß macht.","lvl":5,"cat":"alltag"},{"en":"Whatever happens next, I just want you to know that I'm on your side.","de":"Was auch immer als Nächstes passiert, ich möchte, dass du weißt, dass ich auf deiner Seite stehe.","lvl":5,"cat":"alltag"},{"en":"He comes across as confident, but deep down he's actually quite insecure.","de":"Er wirkt selbstbewusst, aber im Grunde ist er ziemlich unsicher.","lvl":5,"cat":"menschen"},{"en":"I'm afraid we'll have to agree to disagree on this particular point.","de":"Ich fürchte, wir müssen uns in diesem Punkt einfach uneinig bleiben.","lvl":5,"cat":"menschen"},{"en":"The friend I'd been counting on turned out to be unreliable when things got tough.","de":"Der Freund, auf den ich gezählt hatte, erwies sich als unzuverlässig, als es schwierig wurde.","lvl":5,"cat":"menschen"},{"en":"People are often quick to judge, without taking the time to understand the full story.","de":"Menschen urteilen oft schnell, ohne sich die Zeit zu nehmen, die ganze Geschichte zu verstehen.","lvl":5,"cat":"menschen"},{"en":"She has a knack for making complete strangers feel instantly at ease.","de":"Sie hat ein Talent dafür, völlig Fremde sofort entspannen zu lassen.","lvl":5,"cat":"menschen"},{"en":"It's hard to say what he truly wants, since he rarely opens up to anyone.","de":"Es ist schwer zu sagen, was er wirklich will, da er sich kaum jemandem öffnet.","lvl":5,"cat":"menschen"},{"en":"There was a moment when I seriously considered giving up, but something kept me going.","de":"Es gab einen Moment, in dem ich ernsthaft ans Aufgeben dachte, aber irgendetwas hat mich weitermachen lassen.","lvl":5,"cat":"gefuehle"},{"en":"I can't help feeling that we're missing something important here.","de":"Ich werde das Gefühl nicht los, dass uns hier etwas Wichtiges entgeht.","lvl":5,"cat":"gefuehle"},{"en":"The sheer relief of finally finishing the exam was impossible to describe.","de":"Die schiere Erleichterung, die Prüfung endlich hinter mir zu haben, war nicht zu beschreiben.","lvl":5,"cat":"gefuehle"},{"en":"I was torn between staying where I was and chasing a completely new opportunity.","de":"Ich war hin- und hergerissen zwischen dem Bleiben und dem Ergreifen einer völlig neuen Chance.","lvl":5,"cat":"gefuehle"},{"en":"Honestly, I'd be lying if I said that the criticism didn't hurt a little.","de":"Ehrlich gesagt würde ich lügen, wenn ich sagte, die Kritik hätte nicht ein bisschen wehgetan.","lvl":5,"cat":"gefuehle"},{"en":"Had we booked earlier, we could have saved a considerable amount of money on flights.","de":"Hätten wir früher gebucht, hätten wir bei den Flügen eine Menge Geld sparen können.","lvl":5,"cat":"reisen"},{"en":"The trip, which was supposed to be relaxing, turned into a logistical nightmare.","de":"Die Reise, die eigentlich entspannend sein sollte, wurde zu einem logistischen Albtraum.","lvl":5,"cat":"reisen"},{"en":"Having traveled across Asia for months, she felt ready to settle down for a while.","de":"Nachdem sie monatelang durch Asien gereist war, fühlte sie sich bereit, eine Weile sesshaft zu werden.","lvl":5,"cat":"reisen"},{"en":"Passengers are kindly requested to remain seated until the aircraft has come to a complete stop.","de":"Die Fluggäste werden gebeten, sitzen zu bleiben, bis das Flugzeug vollständig zum Stillstand gekommen ist.","lvl":5,"cat":"reisen"},{"en":"I'd recommend trying the local specialty, which is said to be unlike anything you've had before.","de":"Ich würde empfehlen, die lokale Spezialität zu probieren, die angeblich anders ist als alles, was du bisher gegessen hast.","lvl":5,"cat":"essen"},{"en":"I've been advised to cut back on caffeine, but I don't think I could manage that.","de":"Mir wurde geraten, weniger Koffein zu trinken, aber ich glaube nicht, dass ich das schaffe.","lvl":5,"cat":"gesundheit"},{"en":"He didn't realize how stressed he was until his body started to give him warning signs.","de":"Er merkte nicht, wie gestresst er war, bis sein Körper ihm Warnsignale zu geben begann.","lvl":5,"cat":"gesundheit"},{"en":"The author, whose debut novel became a bestseller overnight, refuses to give interviews.","de":"Der Autor, dessen Debütroman über Nacht zum Bestseller wurde, gibt keine Interviews.","lvl":5,"cat":"medien"},{"en":"It's a shame that the series was cancelled just when it was finally getting interesting.","de":"Schade, dass die Serie gerade abgesetzt wurde, als sie endlich interessant wurde.","lvl":5,"cat":"medien"},{"en":"Should you encounter any further difficulties, please do not hesitate to get in touch with us.","de":"Sollten weitere Schwierigkeiten auftreten, zögern Sie bitte nicht, uns zu kontaktieren.","lvl":5,"cat":"technik"},{"en":"No sooner had we sat down to eat than the doorbell rang.","de":"Kaum hatten wir uns zum Essen hingesetzt, klingelte es an der Tür.","lvl":5,"cat":"zeit"},{"en":"I was under the impression that the price included delivery, so I'm a bit surprised.","de":"Ich war der Annahme, dass der Preis die Lieferung enthält, daher bin ich etwas überrascht.","lvl":5,"cat":"einkaufen"},{"en":"Had it not been for the heavy rain, we would have continued our hike to the summit.","de":"Wäre da nicht der starke Regen gewesen, hätten wir unsere Wanderung zum Gipfel fortgesetzt.","lvl":5,"cat":"natur"},{"en":"The way I see it, there's no point in arguing over something that can't be changed.","de":"Meiner Ansicht nach hat es keinen Sinn, sich über etwas zu streiten, das sich nicht ändern lässt.","lvl":5,"cat":"sonstiges"},{"en":"I'm inclined to agree with you, although I do have a few reservations.","de":"Ich neige dazu, dir zuzustimmen, obwohl ich einige Vorbehalte habe.","lvl":5,"cat":"sonstiges"},{"en":"It remains to be seen whether the new policy will actually make any difference.","de":"Es bleibt abzuwarten, ob die neue Regelung tatsächlich etwas ändern wird.","lvl":5,"cat":"sonstiges"},{"en":"Unless we hire more people, we won't be able to meet the deadline.","de":"Wenn wir nicht mehr Leute einstellen, schaffen wir die Frist nicht.","lvl":5,"cat":"arbeit"},{"en":"I'm not saying you're wrong, but have you considered another option?","de":"Ich sage nicht, dass du unrecht hast, aber hast du eine andere Möglichkeit in Betracht gezogen?","lvl":5,"cat":"sonstiges"},{"en":"It's not that I don't like him, it's just that we have nothing in common.","de":"Es ist nicht so, dass ich ihn nicht mag, wir haben einfach nichts gemeinsam.","lvl":5,"cat":"sonstiges"},{"en":"To be honest, I'd rather not get involved in this argument.","de":"Ehrlich gesagt möchte ich mich lieber nicht in diesen Streit einmischen.","lvl":5,"cat":"sonstiges"}],"dialogues":[{"id":"d1","lvl":1,"title":"Im Café","title_en":"At the café","scene":"Du bestellst einen Kaffee und ein Stück Kuchen in einem kleinen Café.","lines":[{"who":"A","en":"Hi, what can I get you?","de":"Hallo, was darf es sein?"},{"who":"B","en":"A coffee, please.","de":"Einen Kaffee, bitte."},{"who":"A","en":"Small, medium or large?","de":"Klein, mittel oder groß?"},{"who":"B","en":"Medium, please. And a piece of cake.","de":"Mittel, bitte. Und ein Stück Kuchen."},{"who":"A","en":"Sure. We have chocolate or apple cake.","de":"Klar. Wir haben Schoko- oder Apfelkuchen."},{"who":"B","en":"Chocolate, please.","de":"Schokolade, bitte."},{"who":"A","en":"That's six dollars. For here or to go?","de":"Das macht sechs Dollar. Zum Hier-Essen oder zum Mitnehmen?"},{"who":"B","en":"For here, thanks.","de":"Zum Hier-Essen, danke."}],"quiz":[{"q":"What kind of cake does the customer order?","opts":["Apple cake","Cheesecake","Chocolate cake","Carrot cake"],"a":2},{"q":"Where does the customer want to drink the coffee?","opts":["To go","At the café","At home","In the car"],"a":1}],"phrases":[{"en":"What can I get you?","de":"Was darf es sein?","note":"Standardfrage von Kellnern und Verkäufern."},{"en":"For here or to go?","de":"Hier essen oder zum Mitnehmen?","note":"Britisch oft: 'Eat in or take away?'"},{"en":"A coffee, please.","de":"Einen Kaffee, bitte.","note":"'please' nie vergessen, sonst klingt es unhöflich."}]},{"id":"d2","lvl":1,"title":"Sich vorstellen","title_en":"Introducing yourself","scene":"Du lernst auf einer Party jemanden kennen und stellst dich vor.","lines":[{"who":"A","en":"Hi, I'm Anna. What's your name?","de":"Hi, ich bin Anna. Wie heißt du?"},{"who":"B","en":"Hi Anna, I'm Daniel. Nice to meet you.","de":"Hi Anna, ich bin Daniel. Freut mich."},{"who":"A","en":"Nice to meet you too. Where are you from?","de":"Freut mich auch. Woher kommst du?"},{"who":"B","en":"I'm from Germany. And you?","de":"Ich komme aus Deutschland. Und du?"},{"who":"A","en":"I'm from Canada, but I live here now.","de":"Ich komme aus Kanada, aber ich wohne jetzt hier."},{"who":"B","en":"Oh, cool! What do you do?","de":"Oh, cool! Was machst du beruflich?"},{"who":"A","en":"I'm a teacher. How about you?","de":"Ich bin Lehrerin. Und du?"},{"who":"B","en":"I'm a mechanic.","de":"Ich bin Mechaniker."}],"quiz":[{"q":"Where is Anna from?","opts":["Germany","Canada","England","Australia"],"a":1},{"q":"What is Anna's job?","opts":["Mechanic","Doctor","Student","Teacher"],"a":3}],"phrases":[{"en":"Nice to meet you.","de":"Freut mich, dich kennenzulernen.","note":"Antwort: 'Nice to meet you too.'"},{"en":"Where are you from?","de":"Woher kommst du?","note":"Nicht 'Where come you from'."},{"en":"What do you do?","de":"Was machst du beruflich?","note":"Frage nach dem Beruf, nicht nach dem Hobby."}]},{"id":"d3","lvl":1,"title":"Hotel einchecken","title_en":"Checking in at a hotel","scene":"Du kommst abends im Hotel an und checkst ein.","lines":[{"who":"A","en":"Good evening. Can I help you?","de":"Guten Abend. Kann ich Ihnen helfen?"},{"who":"B","en":"Yes, I have a reservation. My name is Becker.","de":"Ja, ich habe eine Reservierung. Mein Name ist Becker."},{"who":"A","en":"One moment, please. Yes, two nights, right?","de":"Einen Moment, bitte. Ja, zwei Nächte, richtig?"},{"who":"B","en":"Yes, that's right.","de":"Ja, das stimmt."},{"who":"A","en":"Here is your key. You're in room 305.","de":"Hier ist Ihr Schlüssel. Sie haben Zimmer 305."},{"who":"B","en":"Thank you. What time is breakfast?","de":"Danke. Um wie viel Uhr gibt es Frühstück?"},{"who":"A","en":"From seven to ten, on the first floor.","de":"Von sieben bis zehn, im ersten Stock."},{"who":"B","en":"Great, thanks!","de":"Super, danke!"}],"quiz":[{"q":"How many nights does the guest stay?","opts":["One","Two","Three","Five"],"a":1},{"q":"What time does breakfast start?","opts":["Six","Seven","Eight","Ten"],"a":1}],"phrases":[{"en":"I have a reservation.","de":"Ich habe eine Reservierung.","note":"Britisch auch: 'I've got a booking.'"},{"en":"What time is breakfast?","de":"Wann gibt es Frühstück?","note":"Man fragt nach der Uhrzeit mit 'What time'."},{"en":"Here is your key.","de":"Hier ist Ihr Schlüssel.","note":"Oft auch 'key card'."}]},{"id":"d4","lvl":1,"title":"Im Taxi","title_en":"In a taxi","scene":"Du steigst am Bahnhof in ein Taxi und fährst zu deinem Hotel.","lines":[{"who":"A","en":"Hello. Where to?","de":"Hallo. Wohin soll es gehen?"},{"who":"B","en":"To the Grand Hotel, please.","de":"Zum Grand Hotel, bitte."},{"who":"A","en":"Okay. Do you have any bags?","de":"Okay. Haben Sie Gepäck?"},{"who":"B","en":"Yes, one big bag. It's here.","de":"Ja, eine große Tasche. Sie ist hier."},{"who":"A","en":"No problem. It's about ten minutes.","de":"Kein Problem. Es dauert etwa zehn Minuten."},{"who":"B","en":"How much is it?","de":"Wie viel kostet das?"},{"who":"A","en":"Around fifteen dollars.","de":"Ungefähr fünfzehn Dollar."},{"who":"B","en":"Okay, thank you.","de":"Okay, danke."}],"quiz":[{"q":"Where does the passenger want to go?","opts":["The airport","The Grand Hotel","The station","A restaurant"],"a":1},{"q":"How long is the ride?","opts":["Two minutes","Ten minutes","Fifteen minutes","One hour"],"a":1}],"phrases":[{"en":"To the airport, please.","de":"Zum Flughafen, bitte.","note":"Einfach 'To' + Ziel, mehr braucht man nicht."},{"en":"How much is it?","de":"Wie viel kostet das?","note":"Im Taxi auch 'How much will it be?'"},{"en":"It's about ten minutes.","de":"Es dauert etwa zehn Minuten.","note":"'about' = ungefähr."}]},{"id":"d5","lvl":1,"title":"Kleidung kaufen","title_en":"Buying clothes","scene":"Du suchst in einem Geschäft ein T-Shirt in der richtigen Größe.","lines":[{"who":"A","en":"Can I help you?","de":"Kann ich Ihnen helfen?"},{"who":"B","en":"Yes, I like this T-shirt. Do you have it in blue?","de":"Ja, mir gefällt dieses T-Shirt. Haben Sie es in Blau?"},{"who":"A","en":"Yes, we do. What size are you?","de":"Ja, haben wir. Welche Größe haben Sie?"},{"who":"B","en":"I'm a medium.","de":"Ich habe Größe M."},{"who":"A","en":"Here you go. The fitting room is over there.","de":"Bitte sehr. Die Umkleide ist dort drüben."},{"who":"B","en":"Thanks. ... It's a little small. Do you have a large?","de":"Danke. ... Es ist etwas klein. Haben Sie ein L?"},{"who":"A","en":"Sure, one second.","de":"Klar, eine Sekunde."},{"who":"B","en":"Perfect! I'll take it.","de":"Perfekt! Ich nehme es."}],"quiz":[{"q":"What color does the customer want?","opts":["Red","Black","White","Blue"],"a":3},{"q":"Why does he ask for a large?","opts":["The medium is too small","The medium is too expensive","He doesn't like the color","It's for a friend"],"a":0}],"phrases":[{"en":"Do you have it in blue?","de":"Haben Sie es in Blau?","note":"Praktisch für Farben und Größen."},{"en":"Where is the fitting room?","de":"Wo ist die Umkleidekabine?","note":"Amerikanisch 'fitting room', britisch 'changing room'."},{"en":"I'll take it.","de":"Ich nehme es.","note":"So sagt man beim Kauf zu."}]},{"id":"d6","lvl":1,"title":"Nach dem Weg fragen","title_en":"Asking for directions","scene":"Du suchst auf der Straße die nächste Bushaltestelle.","lines":[{"who":"A","en":"Excuse me, where is the bus stop?","de":"Entschuldigung, wo ist die Bushaltestelle?"},{"who":"B","en":"Go straight, then turn left at the bank.","de":"Gehen Sie geradeaus und dann an der Bank links."},{"who":"A","en":"Turn left at the bank. Okay.","de":"An der Bank links. Okay."},{"who":"B","en":"Then it's on the right, next to the pharmacy.","de":"Dann ist es rechts, neben der Apotheke."},{"who":"A","en":"Is it far?","de":"Ist es weit?"},{"who":"B","en":"No, it's only five minutes on foot.","de":"Nein, es sind nur fünf Minuten zu Fuß."},{"who":"A","en":"Great. Thank you so much!","de":"Super. Vielen Dank!"},{"who":"B","en":"You're welcome. Have a nice day!","de":"Gern geschehen. Schönen Tag noch!"}],"quiz":[{"q":"Where should he turn left?","opts":["At the bank","At the pharmacy","At the school","At the park"],"a":0},{"q":"How far is the bus stop?","opts":["One minute","Five minutes","Twenty minutes","One hour"],"a":1}],"phrases":[{"en":"Excuse me, where is the station?","de":"Entschuldigung, wo ist der Bahnhof?","note":"'Excuse me' ist die höfliche Einleitung."},{"en":"Turn left.","de":"Biegen Sie links ab.","note":"Auch: 'Turn right', 'Go straight'."},{"en":"Is it far?","de":"Ist es weit?","note":"Kurze, wichtige Frage."}]},{"id":"d7","lvl":1,"title":"Am Flughafen einchecken","title_en":"Checking in at the airport","scene":"Du gibst am Check-in-Schalter deinen Koffer auf.","lines":[{"who":"A","en":"Good morning. Passport, please.","de":"Guten Morgen. Ihren Reisepass, bitte."},{"who":"B","en":"Here you are.","de":"Bitte sehr."},{"who":"A","en":"Thank you. Are you checking any bags?","de":"Danke. Geben Sie Gepäck auf?"},{"who":"B","en":"Yes, one suitcase.","de":"Ja, einen Koffer."},{"who":"A","en":"Please put it on the scale. It's 18 kilos. That's fine.","de":"Bitte stellen Sie ihn auf die Waage. Es sind 18 Kilo. Das ist in Ordnung."},{"who":"B","en":"Can I have a window seat?","de":"Kann ich einen Fensterplatz haben?"},{"who":"A","en":"Yes, seat 14A. Boarding is at gate 22, at 10:30.","de":"Ja, Sitz 14A. Das Boarding ist an Gate 22 um 10:30."},{"who":"B","en":"Thank you!","de":"Danke!"}],"quiz":[{"q":"What seat does the passenger get?","opts":["14A","22A","10C","30B"],"a":0},{"q":"How many bags does he check?","opts":["None","One","Two","Three"],"a":1}],"phrases":[{"en":"Here you are.","de":"Bitte sehr / Hier bitte.","note":"Beim Überreichen von etwas."},{"en":"Can I have a window seat?","de":"Kann ich einen Fensterplatz haben?","note":"Gangplatz = 'aisle seat'."},{"en":"What gate is it?","de":"An welchem Gate ist es?","note":"Auch: 'Which gate?'"}]},{"id":"d8","lvl":1,"title":"Im Restaurant","title_en":"At a restaurant","scene":"Du bestellst in einem Restaurant das Abendessen.","lines":[{"who":"A","en":"Are you ready to order?","de":"Sind Sie bereit zu bestellen?"},{"who":"B","en":"Yes. I'd like the chicken with rice, please.","de":"Ja. Ich hätte gern das Hähnchen mit Reis."},{"who":"A","en":"Okay. And to drink?","de":"Okay. Und zu trinken?"},{"who":"B","en":"Just water, please.","de":"Nur Wasser, bitte."},{"who":"A","en":"Anything else? A salad, maybe?","de":"Noch etwas? Vielleicht einen Salat?"},{"who":"B","en":"No, thanks. That's all.","de":"Nein, danke. Das ist alles."},{"who":"A","en":"Perfect. It'll be about fifteen minutes.","de":"Perfekt. Es dauert etwa fünfzehn Minuten."},{"who":"B","en":"No problem.","de":"Kein Problem."}],"quiz":[{"q":"What does the guest order to eat?","opts":["Fish","Chicken with rice","A salad","Pizza"],"a":1},{"q":"What does he drink?","opts":["Cola","Beer","Water","Juice"],"a":2}],"phrases":[{"en":"I'd like the chicken, please.","de":"Ich hätte gern das Hähnchen.","note":"'I'd like' ist höflicher als 'I want'."},{"en":"That's all, thanks.","de":"Das ist alles, danke.","note":"Beendet die Bestellung."},{"en":"Can I have the bill, please?","de":"Kann ich die Rechnung haben?","note":"US: 'check', UK: 'bill'."}]},{"id":"d9","lvl":1,"title":"Ein kurzer Anruf","title_en":"A short phone call","scene":"Du rufst einen Freund an, um dich zu verabreden.","lines":[{"who":"A","en":"Hello?","de":"Hallo?"},{"who":"B","en":"Hi Tom, it's Daniel. How are you?","de":"Hi Tom, hier ist Daniel. Wie geht's?"},{"who":"A","en":"Hey Daniel! I'm good, thanks. And you?","de":"Hey Daniel! Mir geht's gut, danke. Und dir?"},{"who":"B","en":"I'm fine. Are you free tomorrow?","de":"Gut. Hast du morgen Zeit?"},{"who":"A","en":"Yes, after work. Why?","de":"Ja, nach der Arbeit. Warum?"},{"who":"B","en":"Let's have dinner. Maybe at seven?","de":"Lass uns zusammen essen. Vielleicht um sieben?"},{"who":"A","en":"Sounds good. See you tomorrow!","de":"Klingt gut. Bis morgen!"},{"who":"B","en":"Great, bye!","de":"Super, tschüss!"}],"quiz":[{"q":"Why does Daniel call Tom?","opts":["To ask for money","To plan dinner","To say sorry","To ask about work"],"a":1},{"q":"What time do they plan to meet?","opts":["Six","Seven","Eight","Nine"],"a":1}],"phrases":[{"en":"It's Daniel.","de":"Hier ist Daniel.","note":"Am Telefon sagt man 'It's ...', nicht 'I am ...'."},{"en":"Are you free tomorrow?","de":"Hast du morgen Zeit?","note":"'free' = Zeit haben."},{"en":"Sounds good.","de":"Klingt gut.","note":"Sehr häufige Zustimmung."}]},{"id":"d10","lvl":2,"title":"Beim Arzt","title_en":"At the doctor's","scene":"Du fühlst dich seit zwei Tagen krank und gehst zum Arzt.","lines":[{"who":"A","en":"Hello, what seems to be the problem?","de":"Hallo, wo liegt das Problem?"},{"who":"B","en":"I've had a sore throat and a headache for two days.","de":"Ich habe seit zwei Tagen Halsschmerzen und Kopfschmerzen."},{"who":"A","en":"Do you have a fever?","de":"Haben Sie Fieber?"},{"who":"B","en":"A little. It was 38 degrees this morning.","de":"Ein bisschen. Heute Morgen waren es 38 Grad."},{"who":"A","en":"Let me have a look. Open your mouth, please.","de":"Ich schaue mal. Öffnen Sie bitte den Mund."},{"who":"A","en":"It looks a bit red. I think you have a cold.","de":"Es sieht etwas rot aus. Ich glaube, Sie haben eine Erkältung."},{"who":"B","en":"Do I need any medicine?","de":"Brauche ich Medikamente?"},{"who":"A","en":"Just rest, drink a lot of water and take these tablets twice a day.","de":"Ruhen Sie sich aus, trinken Sie viel Wasser und nehmen Sie diese Tabletten zweimal täglich."}],"quiz":[{"q":"How long has the patient been sick?","opts":["One day","Two days","A week","A month"],"a":1},{"q":"What does the doctor think it is?","opts":["The flu","An allergy","A cold","Nothing"],"a":2}],"phrases":[{"en":"I've had a headache for two days.","de":"Ich habe seit zwei Tagen Kopfschmerzen.","note":"Mit 'for' + Zeitraum benutzt man das Present Perfect."},{"en":"Do you have a fever?","de":"Haben Sie Fieber?","note":"'a fever' immer mit Artikel."},{"en":"Take these twice a day.","de":"Nehmen Sie das zweimal täglich.","note":"'once / twice / three times a day'."}]},{"id":"d11","lvl":2,"title":"Smalltalk am Wochenende","title_en":"Weekend small talk","scene":"Montagmorgen im Büro: Zwei Kollegen reden über das Wochenende.","lines":[{"who":"A","en":"Morning! How was your weekend?","de":"Morgen! Wie war dein Wochenende?"},{"who":"B","en":"Pretty good, thanks. We went hiking on Saturday.","de":"Ziemlich gut, danke. Wir waren am Samstag wandern."},{"who":"A","en":"Nice! Where did you go?","de":"Schön! Wo wart ihr?"},{"who":"B","en":"To the lake near the mountains. The weather was perfect.","de":"Zum See in der Nähe der Berge. Das Wetter war perfekt."},{"who":"A","en":"I'm jealous. It rained all weekend here.","de":"Ich bin neidisch. Hier hat es das ganze Wochenende geregnet."},{"who":"B","en":"Oh no. So what did you do?","de":"Oh nein. Was hast du dann gemacht?"},{"who":"A","en":"Nothing special. I watched TV and cleaned the apartment.","de":"Nichts Besonderes. Ich habe ferngesehen und die Wohnung geputzt."},{"who":"B","en":"Well, at least it's a new week. Coffee?","de":"Na ja, immerhin ist es eine neue Woche. Kaffee?"}],"quiz":[{"q":"What did speaker B do on Saturday?","opts":["Cleaned the apartment","Went hiking","Watched TV","Stayed home"],"a":1},{"q":"How was the weather for speaker A?","opts":["Sunny","Windy","Snowy","Rainy"],"a":3}],"phrases":[{"en":"How was your weekend?","de":"Wie war dein Wochenende?","note":"Klassischer Einstieg am Montag."},{"en":"I'm jealous.","de":"Ich bin neidisch.","note":"Freundlich gemeint, nicht böse."},{"en":"Nothing special.","de":"Nichts Besonderes.","note":"Typische Antwort auf 'What did you do?'"}]},{"id":"d12","lvl":2,"title":"Problem im Hotelzimmer","title_en":"A problem in the hotel room","scene":"In deinem Hotelzimmer funktioniert die Klimaanlage nicht, du rufst die Rezeption an.","lines":[{"who":"A","en":"Front desk, how can I help?","de":"Rezeption, wie kann ich helfen?"},{"who":"B","en":"Hi, this is room 412. The air conditioning doesn't work.","de":"Hallo, hier ist Zimmer 412. Die Klimaanlage funktioniert nicht."},{"who":"A","en":"I'm sorry to hear that. Is it making any noise?","de":"Das tut mir leid. Macht sie irgendwelche Geräusche?"},{"who":"B","en":"No, it's just not cold. It's really hot in here.","de":"Nein, sie wird einfach nicht kalt. Es ist wirklich heiß hier drin."},{"who":"A","en":"I'll send someone up in ten minutes.","de":"Ich schicke in zehn Minuten jemanden hoch."},{"who":"B","en":"Okay. Could I also get extra towels?","de":"Okay. Könnte ich auch noch zusätzliche Handtücher bekommen?"},{"who":"A","en":"Of course. They'll come with the technician.","de":"Natürlich. Die bringt der Techniker mit."},{"who":"B","en":"Thanks a lot.","de":"Vielen Dank."}],"quiz":[{"q":"What is wrong in the room?","opts":["The TV is broken","The shower is cold","The air conditioning doesn't work","The bed is dirty"],"a":2},{"q":"What else does the guest ask for?","opts":["Extra towels","A new room","A late checkout","Breakfast"],"a":0}],"phrases":[{"en":"It doesn't work.","de":"Es funktioniert nicht.","note":"Universelle Beschwerde, passt für fast alles."},{"en":"I'll send someone up.","de":"Ich schicke jemanden hoch.","note":"'send up' = aufs Zimmer schicken."},{"en":"Could I also get extra towels?","de":"Könnte ich noch zusätzliche Handtücher bekommen?","note":"'Could I' ist sehr höflich."}]},{"id":"d13","lvl":2,"title":"Im Supermarkt","title_en":"At the supermarket","scene":"Du suchst im Supermarkt ein paar Produkte und fragst einen Mitarbeiter.","lines":[{"who":"A","en":"Excuse me, where can I find the milk?","de":"Entschuldigung, wo finde ich die Milch?"},{"who":"B","en":"It's in aisle five, next to the cheese.","de":"Im Gang fünf, neben dem Käse."},{"who":"A","en":"Thanks. And do you sell gluten-free bread?","de":"Danke. Und verkaufen Sie glutenfreies Brot?"},{"who":"B","en":"Yes, but we only have a few left. It's on the bottom shelf.","de":"Ja, aber wir haben nur noch ein paar. Es liegt im untersten Regal."},{"who":"A","en":"Got it. Is there a self-checkout?","de":"Alles klar. Gibt es eine Selbstbedienungskasse?"},{"who":"B","en":"Yes, near the entrance. It's faster if you only have a few things.","de":"Ja, beim Eingang. Das geht schneller, wenn man nur wenige Sachen hat."},{"who":"A","en":"Perfect, I only need five items.","de":"Perfekt, ich brauche nur fünf Artikel."},{"who":"B","en":"Then you'll be out in no time.","de":"Dann sind Sie im Nu fertig."}],"quiz":[{"q":"Where is the milk?","opts":["Aisle two","Aisle five","Near the entrance","On the bottom shelf"],"a":1},{"q":"Why does she use the self-checkout?","opts":["It's cheaper","She has only a few things","The other lines are closed","She likes machines"],"a":1}],"phrases":[{"en":"Where can I find the milk?","de":"Wo finde ich die Milch?","note":"Besser als 'Where is...?' im Laden."},{"en":"We only have a few left.","de":"Wir haben nur noch ein paar.","note":"'a few' = ein paar, 'few' = kaum welche."},{"en":"in no time","de":"im Nu","note":"Bedeutet 'sehr schnell'."}]},{"id":"d14","lvl":2,"title":"Pläne mit einem Freund","title_en":"Making plans with a friend","scene":"Zwei Freunde schreiben per Telefon, was sie am Freitagabend machen.","lines":[{"who":"A","en":"Hey! Are you doing anything on Friday night?","de":"Hey! Hast du Freitagabend was vor?"},{"who":"B","en":"Not really. Why, what's up?","de":"Eigentlich nicht. Warum, was gibt's?"},{"who":"A","en":"There's a new Italian place downtown. Want to try it?","de":"In der Innenstadt gibt es einen neuen Italiener. Lust, ihn auszuprobieren?"},{"who":"B","en":"Sure! What time?","de":"Klar! Wann?"},{"who":"A","en":"How about 7:30? I can book a table.","de":"Wie wäre es mit 19:30 Uhr? Ich kann einen Tisch reservieren."},{"who":"B","en":"Perfect. Should I bring Mia too?","de":"Perfekt. Soll ich Mia auch mitbringen?"},{"who":"A","en":"Yes, the more the merrier!","de":"Ja, je mehr, desto besser!"},{"who":"B","en":"Great. I'll text her now.","de":"Super. Ich schreibe ihr gleich."}],"quiz":[{"q":"What kind of restaurant do they choose?","opts":["Chinese","Italian","Mexican","French"],"a":1},{"q":"Who might join them?","opts":["Tom","Anna","Mia","Nobody"],"a":2}],"phrases":[{"en":"Are you doing anything on Friday?","de":"Hast du Freitag was vor?","note":"Present Continuous für feste Pläne."},{"en":"How about 7:30?","de":"Wie wäre es mit 19:30 Uhr?","note":"Vorschlag mit 'How about'."},{"en":"The more the merrier.","de":"Je mehr, desto besser.","note":"Feste Redewendung."}]},{"id":"d15","lvl":2,"title":"Verlorenes Gepäck","title_en":"Lost luggage","scene":"Nach der Landung ist dein Koffer nicht auf dem Band, du gehst zum Schalter.","lines":[{"who":"A","en":"Hello, how can I help you?","de":"Hallo, wie kann ich Ihnen helfen?"},{"who":"B","en":"My suitcase didn't arrive. I waited at the belt for half an hour.","de":"Mein Koffer ist nicht angekommen. Ich habe eine halbe Stunde am Band gewartet."},{"who":"A","en":"I'm sorry. What does it look like?","de":"Das tut mir leid. Wie sieht er aus?"},{"who":"B","en":"It's a large black suitcase with a red ribbon on the handle.","de":"Es ist ein großer schwarzer Koffer mit einem roten Band am Griff."},{"who":"A","en":"Do you have your baggage tag?","de":"Haben Sie Ihren Gepäckanhänger?"},{"who":"B","en":"Yes, here it is.","de":"Ja, hier ist er."},{"who":"A","en":"Okay. It looks like it stayed in Frankfurt. We'll deliver it to your hotel tomorrow.","de":"Okay. Es sieht so aus, als wäre er in Frankfurt geblieben. Wir liefern ihn morgen zu Ihrem Hotel."},{"who":"B","en":"Thank God. Please call me when it's on the way.","de":"Gott sei Dank. Bitte rufen Sie mich an, wenn er unterwegs ist."}],"quiz":[{"q":"What does the suitcase look like?","opts":["Small and blue","Large and black with a red ribbon","Brown with a lock","Green with stickers"],"a":1},{"q":"Where is the suitcase now?","opts":["In Frankfurt","At the hotel","In the taxi","Nobody knows"],"a":0}],"phrases":[{"en":"My suitcase didn't arrive.","de":"Mein Koffer ist nicht angekommen.","note":"'Luggage' (US) / 'baggage' (UK + offiziell)."},{"en":"What does it look like?","de":"Wie sieht er aus?","note":"Nicht 'How does it look' für Aussehen."},{"en":"We'll deliver it to your hotel.","de":"Wir liefern ihn zu Ihrem Hotel.","note":"'deliver' = liefern."}]},{"id":"d16","lvl":2,"title":"Fahrkarten kaufen","title_en":"Buying train tickets","scene":"Am Bahnhof kaufst du eine Fahrkarte nach Boston.","lines":[{"who":"A","en":"Hi, I'd like a ticket to Boston, please.","de":"Hallo, ich hätte gern eine Fahrkarte nach Boston."},{"who":"B","en":"One way or round trip?","de":"Einfach oder hin und zurück?"},{"who":"A","en":"Round trip. I'm coming back on Sunday.","de":"Hin und zurück. Ich komme am Sonntag zurück."},{"who":"B","en":"That's 64 dollars. The next train leaves at 2:15 from platform 3.","de":"Das macht 64 Dollar. Der nächste Zug fährt um 14:15 von Gleis 3."},{"who":"A","en":"Is it a direct train?","de":"Ist das ein Direktzug?"},{"who":"B","en":"Yes, it takes about four hours.","de":"Ja, er braucht etwa vier Stunden."},{"who":"A","en":"Can I pay by card?","de":"Kann ich mit Karte zahlen?"},{"who":"B","en":"Sure. Just insert your card here.","de":"Klar. Stecken Sie hier einfach Ihre Karte ein."}],"quiz":[{"q":"What kind of ticket does he buy?","opts":["One way","Round trip","Weekly pass","Student ticket"],"a":1},{"q":"How long does the trip take?","opts":["Two hours","Three hours","About four hours","Eight hours"],"a":2}],"phrases":[{"en":"One way or round trip?","de":"Einfach oder hin und zurück?","note":"UK: 'single or return?'"},{"en":"Is it a direct train?","de":"Ist es ein Direktzug?","note":"Gegenteil: 'with a change'."},{"en":"Can I pay by card?","de":"Kann ich mit Karte zahlen?","note":"'in cash' = bar."}]},{"id":"d17","lvl":2,"title":"In der Apotheke","title_en":"At the pharmacy","scene":"Du bist erkältet und fragst in der Apotheke nach Medikamenten.","lines":[{"who":"A","en":"Hi, can I help you with something?","de":"Hallo, kann ich Ihnen bei etwas helfen?"},{"who":"B","en":"Yes, I've got a runny nose and I keep sneezing.","de":"Ja, ich habe eine laufende Nase und muss ständig niesen."},{"who":"A","en":"Do you have a cough too?","de":"Haben Sie auch Husten?"},{"who":"B","en":"No, just a bit of a sore throat.","de":"Nein, nur etwas Halsschmerzen."},{"who":"A","en":"Okay. These nose drops and these lozenges should help.","de":"Okay. Diese Nasentropfen und diese Lutschtabletten sollten helfen."},{"who":"B","en":"How often should I take them?","de":"Wie oft soll ich sie nehmen?"},{"who":"A","en":"The drops three times a day, the lozenges whenever you need them.","de":"Die Tropfen dreimal täglich, die Lutschtabletten nach Bedarf."},{"who":"B","en":"Thanks. How much is that?","de":"Danke. Was macht das?"}],"quiz":[{"q":"What symptom does the customer NOT have?","opts":["Runny nose","Sneezing","Sore throat","Cough"],"a":3},{"q":"How often should he use the drops?","opts":["Once a day","Twice a day","Three times a day","Only at night"],"a":2}],"phrases":[{"en":"I've got a runny nose.","de":"Ich habe eine laufende Nase.","note":"'I've got' ist lockerer als 'I have'."},{"en":"How often should I take them?","de":"Wie oft soll ich sie nehmen?","note":"Wichtige Frage in der Apotheke."},{"en":"whenever you need them","de":"wann immer Sie sie brauchen","note":"'whenever' = jedes Mal wenn."}]},{"id":"d18","lvl":2,"title":"Erstes Treffen im Büro","title_en":"First day at work","scene":"Es ist dein erster Arbeitstag und eine Kollegin zeigt dir das Büro.","lines":[{"who":"A","en":"Hi! You must be Daniel. I'm Sarah, welcome to the team.","de":"Hi! Du musst Daniel sein. Ich bin Sarah, willkommen im Team."},{"who":"B","en":"Thanks, Sarah. Nice to meet you. I'm a bit nervous.","de":"Danke, Sarah. Freut mich. Ich bin ein bisschen nervös."},{"who":"A","en":"Don't worry, everyone is really friendly. This is your desk.","de":"Keine Sorge, alle sind wirklich nett. Das ist dein Schreibtisch."},{"who":"B","en":"Great. Where's the kitchen?","de":"Super. Wo ist die Küche?"},{"who":"A","en":"Down the hall on the left. We usually have lunch together at noon.","de":"Den Flur runter links. Wir essen meistens um zwölf zusammen."},{"who":"B","en":"That sounds nice. When is the first meeting?","de":"Das klingt nett. Wann ist das erste Meeting?"},{"who":"A","en":"At ten. I'll show you the conference room.","de":"Um zehn. Ich zeige dir den Konferenzraum."},{"who":"B","en":"Thanks, I really appreciate it.","de":"Danke, das weiß ich wirklich zu schätzen."}],"quiz":[{"q":"How does Daniel feel?","opts":["Angry","Bored","A bit nervous","Very tired"],"a":2},{"q":"When is the first meeting?","opts":["At noon","At ten","At nine","At three"],"a":1}],"phrases":[{"en":"You must be Daniel.","de":"Du musst Daniel sein.","note":"'must be' = vermutlich."},{"en":"Don't worry.","de":"Keine Sorge.","note":"Kurz und freundlich."},{"en":"I really appreciate it.","de":"Das weiß ich sehr zu schätzen.","note":"Höflicher als 'thanks'."}]},{"id":"d19","lvl":5,"title":"Streit mit dem Vermieter","title_en":"A dispute with the landlord","scene":"Du sprichst mit deinem Vermieter über Schimmel in der Wohnung und eine geforderte Mieterhöhung.","lines":[{"who":"A","en":"Thanks for coming by. I wanted to discuss the rent increase I mentioned in my letter.","de":"Danke, dass Sie vorbeigekommen sind. Ich wollte die Mieterhöhung besprechen, die ich in meinem Brief erwähnt habe."},{"who":"B","en":"Before we get to that, I'd like to raise an issue. There's mold in the bathroom that's been spreading for months.","de":"Bevor wir dazu kommen, möchte ich ein Problem ansprechen. Im Bad breitet sich seit Monaten Schimmel aus."},{"who":"A","en":"That's news to me. Why didn't you notify me earlier?","de":"Das ist mir neu. Warum haben Sie mich nicht früher informiert?"},{"who":"B","en":"I did. I emailed you twice, and I have the records here. Nothing was done.","de":"Habe ich. Ich habe Ihnen zweimal geschrieben, und ich habe die Belege hier. Es wurde nichts unternommen."},{"who":"A","en":"Well, I must have overlooked them. I'll have a contractor take a look this week.","de":"Dann habe ich sie wohl übersehen. Ich lasse diese Woche einen Handwerker nachsehen."},{"who":"B","en":"I appreciate that, but I can't agree to a rent increase while the apartment is in this condition.","de":"Das weiß ich zu schätzen, aber ich kann einer Mieterhöhung nicht zustimmen, solange die Wohnung in diesem Zustand ist."},{"who":"A","en":"Fair enough. How about we postpone the increase until the repairs are done?","de":"Das ist nachvollziehbar. Wie wäre es, wenn wir die Erhöhung bis zum Abschluss der Reparaturen verschieben?"},{"who":"B","en":"That's reasonable, provided we put it in writing, and the increase stays below ten percent.","de":"Das ist angemessen, sofern wir es schriftlich festhalten und die Erhöhung unter zehn Prozent bleibt."}],"quiz":[{"q":"What problem does the tenant raise?","opts":["Noisy neighbors","Mold in the bathroom","A broken heater","A leaking roof"],"a":1},{"q":"What do they agree on?","opts":["Cancel the rent increase for good","Postpone the increase until repairs are done","Move out","Lower the rent by ten percent"],"a":1}],"phrases":[{"en":"That's news to me.","de":"Das ist mir neu.","note":"Man hat davon nichts gewusst."},{"en":"I can't agree to that.","de":"Dem kann ich nicht zustimmen.","note":"Klare, höfliche Ablehnung."},{"en":"provided we put it in writing","de":"sofern wir es schriftlich festhalten","note":"'provided (that)' = unter der Bedingung."}]},{"id":"d20","lvl":3,"title":"Vorstellungsgespräch","title_en":"A job interview","scene":"Du bewirbst dich als Servicetechniker und sprichst mit der Personalchefin.","lines":[{"who":"A","en":"Thanks for coming in today. Can you tell me a bit about yourself?","de":"Danke, dass Sie gekommen sind. Können Sie etwas über sich erzählen?"},{"who":"B","en":"Sure. I've been working as a mechanic for six years, mostly with industrial machines.","de":"Klar. Ich arbeite seit sechs Jahren als Mechaniker, hauptsächlich an Industriemaschinen."},{"who":"A","en":"Why are you interested in this position?","de":"Warum interessieren Sie sich für diese Stelle?"},{"who":"B","en":"I'm looking for a role where I can learn more about automation and work with a bigger team.","de":"Ich suche eine Rolle, in der ich mehr über Automatisierung lernen und mit einem größeren Team arbeiten kann."},{"who":"A","en":"What would you say is your greatest strength?","de":"Was würden Sie als Ihre größte Stärke bezeichnen?"},{"who":"B","en":"I'm good at solving problems under pressure, and I never give up until it's fixed.","de":"Ich bin gut darin, unter Druck Probleme zu lösen, und gebe nicht auf, bis es repariert ist."},{"who":"A","en":"That's great. And do you have any questions for us?","de":"Das ist toll. Und haben Sie Fragen an uns?"},{"who":"B","en":"Yes, what does a typical day look like in this role?","de":"Ja, wie sieht ein typischer Tag in dieser Rolle aus?"}],"quiz":[{"q":"How long has the candidate worked as a mechanic?","opts":["Two years","Six years","Ten years","One year"],"a":1},{"q":"What does he want to learn more about?","opts":["Marketing","Cooking","Automation","Finance"],"a":2}],"phrases":[{"en":"I've been working as a mechanic for six years.","de":"Ich arbeite seit sechs Jahren als Mechaniker.","note":"Present Perfect Continuous für andauernde Tätigkeit."},{"en":"I'm good at solving problems.","de":"Ich bin gut darin, Probleme zu lösen.","note":"'good at' + -ing."},{"en":"What does a typical day look like?","de":"Wie sieht ein typischer Tag aus?","note":"Gute Frage am Ende jedes Interviews."}]},{"id":"d21","lvl":3,"title":"Beschwerde im Restaurant","title_en":"Complaining at a restaurant","scene":"Dein Essen kommt kalt an und du sprichst den Kellner darauf an.","lines":[{"who":"A","en":"How is everything so far?","de":"Wie ist bisher alles?"},{"who":"B","en":"Honestly, not great. My pasta is cold, and we ordered it forty minutes ago.","de":"Ehrlich gesagt nicht so toll. Meine Pasta ist kalt, und wir haben sie vor vierzig Minuten bestellt."},{"who":"A","en":"Oh, I'm so sorry about that. The kitchen is really busy tonight.","de":"Oh, das tut mir sehr leid. Die Küche ist heute Abend sehr voll."},{"who":"B","en":"I understand, but it's still not acceptable. Could you bring me a fresh one?","de":"Das verstehe ich, aber es ist trotzdem nicht in Ordnung. Könnten Sie mir eine frische bringen?"},{"who":"A","en":"Of course. I'll take care of it right away.","de":"Natürlich. Ich kümmere mich sofort darum."},{"who":"A","en":"And the dessert is on the house to make up for it.","de":"Und das Dessert geht aufs Haus, als Entschädigung."},{"who":"B","en":"That's kind of you, thank you.","de":"Das ist nett von Ihnen, danke."},{"who":"A","en":"No problem. Again, sorry for the wait.","de":"Kein Problem. Nochmals Entschuldigung für die Wartezeit."}],"quiz":[{"q":"What is wrong with the pasta?","opts":["It's too salty","It's cold","It's burnt","It's the wrong dish"],"a":1},{"q":"How does the restaurant make up for it?","opts":["A free dessert","A free drink","A discount card","Nothing"],"a":0}],"phrases":[{"en":"It's still not acceptable.","de":"Es ist trotzdem nicht in Ordnung.","note":"Höflich, aber bestimmt."},{"en":"Could you bring me a fresh one?","de":"Könnten Sie mir eine frische bringen?","note":"'Could you' wirkt höflich, auch bei Beschwerden."},{"en":"It's on the house.","de":"Das geht aufs Haus.","note":"Gratis vom Restaurant."}]},{"id":"d22","lvl":3,"title":"Das erste Date","title_en":"A first date","scene":"Zwei Leute treffen sich zum ersten Mal in einer Bar und lernen sich kennen.","lines":[{"who":"A","en":"Hey, you made it! I was starting to think you got lost.","de":"Hey, du hast es geschafft! Ich dachte schon, du hast dich verlaufen."},{"who":"B","en":"Sorry, I'm a few minutes late. The traffic was crazy.","de":"Sorry, ich bin ein paar Minuten zu spät. Der Verkehr war verrückt."},{"who":"A","en":"No worries. What are you drinking?","de":"Kein Problem. Was trinkst du?"},{"who":"B","en":"Just a soda for me, I'm driving. So, what do you do for fun?","de":"Für mich nur eine Limo, ich fahre. Also, was machst du so zum Spaß?"},{"who":"A","en":"I love hiking and I'm learning to play the guitar. How about you?","de":"Ich gehe gern wandern und lerne gerade Gitarre. Und du?"},{"who":"B","en":"I'm into movies and cooking. I'm kind of a foodie, actually.","de":"Ich mag Filme und Kochen. Eigentlich bin ich ein ziemlicher Feinschmecker."},{"who":"A","en":"Oh, nice. Maybe you could cook for me sometime.","de":"Oh, schön. Vielleicht könntest du irgendwann mal für mich kochen."},{"who":"B","en":"Haha, maybe. Let's see how tonight goes first!","de":"Haha, vielleicht. Mal sehen, wie der Abend läuft!"}],"quiz":[{"q":"Why is he/she drinking soda?","opts":["Doesn't like beer","Is driving","Is sick","It's cheaper"],"a":1},{"q":"What is speaker A learning?","opts":["Cooking","French","Guitar","Dancing"],"a":2}],"phrases":[{"en":"You made it!","de":"Du hast es geschafft! / Schön, dass du da bist!","note":"Freundliche Begrüßung für Ankömmlinge."},{"en":"I'm into movies.","de":"Ich stehe auf Filme.","note":"'be into' = sich für etwas begeistern."},{"en":"Let's see how it goes.","de":"Mal sehen, wie es läuft.","note":"Locker und unverbindlich."}]},{"id":"d23","lvl":3,"title":"Team-Meeting","title_en":"A team meeting","scene":"Dein Team bespricht im Meeting den Stand eines Projekts.","lines":[{"who":"A","en":"Okay, let's get started. Where are we with the website redesign?","de":"Okay, fangen wir an. Wie ist der Stand beim Website-Redesign?"},{"who":"B","en":"We're about 70 percent done. The design is finished, but the testing is still ongoing.","de":"Wir sind zu etwa 70 Prozent fertig. Das Design steht, aber das Testen läuft noch."},{"who":"A","en":"Are we going to hit the deadline on Friday?","de":"Schaffen wir die Frist am Freitag?"},{"who":"B","en":"It's going to be tight. We're waiting for feedback from the client.","de":"Es wird knapp. Wir warten auf Rückmeldung vom Kunden."},{"who":"A","en":"Could you follow up with them today?","de":"Könntest du heute bei ihnen nachfassen?"},{"who":"B","en":"Sure, I'll send them an email right after this meeting.","de":"Klar, ich schicke ihnen direkt nach dem Meeting eine E-Mail."},{"who":"A","en":"Great. If we don't hear back by tomorrow, let me know and I'll call them.","de":"Gut. Wenn wir bis morgen nichts hören, sag mir Bescheid, dann rufe ich an."},{"who":"B","en":"Will do.","de":"Mach ich."}],"quiz":[{"q":"How much of the project is finished?","opts":["30 percent","50 percent","70 percent","100 percent"],"a":2},{"q":"What is the team waiting for?","opts":["A new designer","Client feedback","More money","A new laptop"],"a":1}],"phrases":[{"en":"It's going to be tight.","de":"Es wird knapp.","note":"Zeitlich oder finanziell knapp."},{"en":"I'll follow up with them.","de":"Ich hake bei ihnen nach.","note":"Sehr häufig im Job."},{"en":"Will do.","de":"Mach ich.","note":"Kurz für 'I will do that'."}]},{"id":"d24","lvl":3,"title":"Anruf beim Kundenservice","title_en":"Calling customer service","scene":"Dein Internet funktioniert nicht und du rufst den Anbieter an.","lines":[{"who":"A","en":"Thank you for calling. My name is Chris, how can I help?","de":"Danke für Ihren Anruf. Mein Name ist Chris, wie kann ich helfen?"},{"who":"B","en":"Hi Chris. My internet has been down since yesterday evening.","de":"Hi Chris. Mein Internet ist seit gestern Abend ausgefallen."},{"who":"A","en":"I'm sorry to hear that. Have you tried restarting the router?","de":"Das tut mir leid. Haben Sie versucht, den Router neu zu starten?"},{"who":"B","en":"Yes, twice. The light is still blinking red.","de":"Ja, zweimal. Das Licht blinkt immer noch rot."},{"who":"A","en":"Okay, let me check your line. Could you hold for a moment?","de":"Okay, ich prüfe Ihre Leitung. Könnten Sie einen Moment warten?"},{"who":"B","en":"Sure, no problem.","de":"Klar, kein Problem."},{"who":"A","en":"Thanks for waiting. There's an outage in your area. It should be fixed by tomorrow morning.","de":"Danke fürs Warten. Es gibt eine Störung in Ihrer Gegend. Sie sollte bis morgen früh behoben sein."},{"who":"B","en":"Okay. Will I get a credit for the days without internet?","de":"Okay. Bekomme ich eine Gutschrift für die Tage ohne Internet?"}],"quiz":[{"q":"What is the problem?","opts":["A broken phone","No internet","A wrong bill","A slow TV"],"a":1},{"q":"What is the cause?","opts":["A broken router","An outage in the area","A cut cable at his home","An unpaid bill"],"a":1}],"phrases":[{"en":"Could you hold for a moment?","de":"Könnten Sie kurz warten?","note":"Am Telefon: 'hold the line'."},{"en":"It's been down since yesterday.","de":"Es ist seit gestern ausgefallen.","note":"'down' = außer Betrieb."},{"en":"Will I get a credit?","de":"Bekomme ich eine Gutschrift?","note":"Wichtig bei Beschwerden."}]},{"id":"d25","lvl":3,"title":"Flug verpasst","title_en":"Missed connection","scene":"Wegen einer Verspätung hast du deinen Anschlussflug verpasst und fragst am Schalter nach.","lines":[{"who":"A","en":"Next, please. How can I help you?","de":"Der Nächste, bitte. Wie kann ich helfen?"},{"who":"B","en":"My first flight was delayed, so I missed my connection to Chicago.","de":"Mein erster Flug hatte Verspätung, deshalb habe ich den Anschluss nach Chicago verpasst."},{"who":"A","en":"I see. Let me look at your booking. Yes, I'm afraid that flight has already left.","de":"Ich verstehe. Ich sehe mir Ihre Buchung an. Ja, der Flug ist leider schon weg."},{"who":"B","en":"What are my options? I have an important meeting tomorrow morning.","de":"Was für Möglichkeiten habe ich? Ich habe morgen früh ein wichtiges Meeting."},{"who":"A","en
